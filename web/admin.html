<script>
const S={token:sessionStorage.getItem('v207_token')||'',profile:null,org:'',page:'dashboard',cache:{},loadVersion:0,tableState:{},tableRefresh:{}};
async function runtimeDictionary(force=false){if(!force&&S.cache.runtimeDictionary)return S.cache.runtimeDictionary;const d=await api('/api/v207/admin/dictionaries/runtime'+qp(),{contextGuard:false});return S.cache.runtimeDictionary=d.data||{}}
function staleContextError(){let e=Error('页面上下文已变化');e.code='STALE_CONTEXT';return e}const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
async function api(path,opt={}){let method=opt.method||'GET',requestVersion=S.loadVersion,guard=method==='GET'&&opt.contextGuard!==false,r=await fetch(path,{method,headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{}),...(opt.headers||{})},body:opt.body?JSON.stringify(opt.body):undefined});let d=await r.json().catch(()=>({ok:false,message:'响应格式错误'}));if(r.status===401&&S.token){sessionStorage.removeItem('v207_token');location.reload()}if(guard&&requestVersion!==S.loadVersion)throw staleContextError();if(!r.ok||d.ok===false)throw Error(d.message||d.code||('HTTP '+r.status));return d}
function toast(x,bad=false){let e=$('#toast');e.textContent=x;e.style.border='1px solid '+(bad?'var(--bad)':'var(--ok)');e.classList.remove('hide');setTimeout(()=>e.classList.add('hide'),2800)}
function fmt(t){if(t===undefined||t===null||t==='')return '—';let n=Number(t);if(!Number.isFinite(n))return '—';if(n>0&&n<100000000000)n*=1000;const d=new Date(n);return Number.isNaN(d.getTime())?'—':d.toLocaleString()}
function status(v){const raw=String(v??'unknown').toLowerCase(),m={active:'正常',enabled:'已启用',disabled:'已停用',pending:'待处理',draft:'草稿',planned:'已排期',paused:'已暂停',completed:'已完成',archived:'已归档',revoked:'已撤销',expired:'已过期',inactive:'未启用',locked:'已锁定',deleted:'已删除',unknown:'未知'};const cls=m[raw]?raw:'unknown';return `<span class="status ${cls}">${esc(m[raw]||v||'未知')}</span>`}
function qp(extra){let s='?organization_id='+encodeURIComponent(S.org);if(extra&&typeof extra==='object'){for(const[k,v]of Object.entries(extra)){if(v===undefined||v===null||v==='')continue;s+='&'+encodeURIComponent(k)+'='+encodeURIComponent(v)}}return s}
function sessionStatus(r){if(r.revoked_at)return status('revoked');if(Number(r.expires_at)<=Date.now())return status('expired');return status('active')}
function head(title,desc,action=''){return `<div class="pagehead"><div><h2>${title}</h2><p>${desc}</p></div><span class="grow"></span>${action}</div>`}
function cellValue(col,row){if(typeof col[1]==='function')return {html:true,value:col[1](row)};if(typeof col[2]==='function')return {html:true,value:col[2](row)};return {html:false,value:row[col[1]]}}
function renderCell(col,row){const out=cellValue(col,row),v=out.value;if(v===undefined||v===null)return '';return out.html?String(v):esc(v)}
function table(cols,items,actions){if(!items?.length)return '<div class="panel empty">暂无数据</div>';return `<div class="table-wrap"><table><thead><tr>${cols.map(x=>`<th>${esc(x[0])}</th>`).join('')}${actions?'<th>操作</th>':''}</tr></thead><tbody>${items.map(r=>`<tr>${cols.map(x=>`<td>${renderCell(x,r)}</td>`).join('')}${actions?`<td>${actions(r)}</td>`:''}</tr>`).join('')}</tbody></table></div>`}
function passwordChangeRequired(x){const c=x?.credential||x?.user?.credential||{};return x?.mustChangePassword===true||x?.must_change_password===true||x?.forcePasswordChange===true||x?.passwordChangeRequired===true||x?.user?.mustChangePassword===true||x?.user?.must_change_password===true||c.must_change===true||c.must_change===1||c.mustChange===true}
function showPasswordModal(){$('#login').classList.add('hide');$('#passwordError').textContent='';$('#passwordModal').classList.remove('hide');$('#oldPassword').focus()}
function hidePasswordModal(){$('#passwordModal').classList.add('hide')}
function showOnboardingModal(pd){$('#login').classList.add('hide');$('#app').classList.add('hide');$('#passwordModal').classList.add('hide');$('#onboardingError').textContent='';$('#onboardingOrganization').value=pd?.organization?.name||'';$('#onboardingWorkspace').value=pd?.workspace?.name||'';$('#onboardingTeam').value=pd?.team?.name||'';$('#onboardingDisplayName').value=pd?.user?.display_name||'';$('#onboardingModal').classList.remove('hide');$('#onboardingOrganization').focus()}
function hideOnboardingModal(){$('#onboardingModal').classList.add('hide')}
async function boot(){if(!S.token)return;try{const pd=await api('/api/v207/admin/profile');S.profile=pd;if(pd.onboardingRequired){showOnboardingModal(pd);return}hideOnboardingModal();$('#who').textContent=pd.user.display_name;$('#avatar').textContent=pd.user.display_name.slice(0,1);$('#scope').textContent=pd.platformAdmin?'平台超级管理员':'企业成员';const od=await api('/api/v207/admin/organizations');S.cache.organizations=od.items||[];$('#orgSelect').innerHTML=S.cache.organizations.map(o=>`<option value="${esc(o.organization_id)}">${esc(o.name)} · ${esc(o.organization_id)}</option>`).join('');S.org=pd.user.organization_id;$('#orgSelect').value=S.org;$('#login').classList.add('hide');$('#app').classList.remove('hide');initNavigation();await api('/health');$('#health').textContent='● 服务正常';navigate('dashboard');if(passwordChangeRequired(pd))showPasswordModal()}catch(e){console.error('boot failed:',e);sessionStorage.removeItem('v207_token');S.token='';$('#loginError').textContent=e.message||'登录失败'}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();const error=$('#loginError'),button=e.currentTarget.querySelector('button[type=submit]');error.textContent='';const organizationId=$('#loginOrg').value.trim(),loginName=$('#loginName').value.trim(),password=$('#loginPass').value;if(!organizationId||!loginName||!password){error.textContent='请输入企业 ID、登录名和密码';return}const oldText=button?.textContent;if(button){button.disabled=true;button.textContent='正在安全登录…'}try{const d=await api('/api/v207/auth/login',{method:'POST',body:{organizationId,loginName,password}});S.token=d.accessToken;sessionStorage.setItem('v207_token',S.token);await boot()}catch(x){const messages={INVALID_CREDENTIALS:'企业 ID、登录名或密码错误',ACCOUNT_LOCKED:'登录失败次数过多，账号已临时锁定',ORGANIZATION_NOT_FOUND:'企业不存在',INTERNAL_ERROR:'服务器内部错误，请查看服务日志'};error.textContent=messages[x.code]||x.message||'登录失败，请检查服务是否正常运行'}finally{if(button){button.disabled=false;button.textContent=oldText||'安全登录'}}};
$('#passwordLater').onclick=()=>{hidePasswordModal();toast('已稍后处理，请尽快在个人中心修改密码',1)};
$('#passwordForm').onsubmit=async e=>{e.preventDefault();const error=$('#passwordError'),oldPassword=$('#oldPassword').value,newPassword=$('#newPassword').value,confirmPassword=$('#confirmPassword').value;error.textContent='';if(newPassword!==confirmPassword){error.textContent='两次输入的新密码不一致';return}if(newPassword.length<12||!/[A-Za-z]/.test(newPassword)||!/[0-9]/.test(newPassword)){error.textContent='新密码至少 12 位，并且必须包含字母和数字';return}if(oldPassword===newPassword){error.textContent='新密码不能与当前密码相同';return}try{await api('/api/v207/admin/change-password',{method:'POST',body:{oldPassword,currentPassword:oldPassword,newPassword,confirmPassword}});hidePasswordModal();$('#passwordForm').reset();await boot()}catch(x){error.textContent=x.message||'密码修改失败'}};

function copyToClipboard(text){
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(text).then(()=>toast('已复制')).catch(()=>toast('复制失败',1));
 }else{
  const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('已复制');}catch(_){toast('复制失败',1);}
  document.body.removeChild(ta);
 }
}

async function chHealthLoad(){
 try{
  const d=await api('/api/v207/admin/sources?limit=500');
  const items=d.items||d||[];
  const by={};
  items.forEach(r=>{const c=r.channel_type_name||r.platform_name||r.source_type_name||'未分类';by[c]=by[c]||{a:0,t:0,last:0};
   by[c].t++;if(r.status==='active')by[c].a++;
   if(r.last_seen_at&&r.last_seen_at>by[c].last)by[c].last=r.last_seen_at;});
  const now=Date.now();
  let rows=Object.entries(by).sort((x,y)=>y[1].t-x[1].t).map(([c,v])=>{
   const pct=v.t?Math.round(v.a*100/v.t):0;
   const stale=v.a===0||(v.last&&now-v.last>30*864e5);
   const col=pct>=80?'var(--ok)':pct>=50?'var(--warn,#d97706)':'var(--err,#dc2626)';
   return `<tr><td>${esc(c)}</td><td>${v.a} / ${v.t}</td>`+
    `<td><div style="background:var(--line,#e5e7eb);border-radius:4px;height:8px;width:120px;display:inline-block;vertical-align:middle"><div style="background:${col};height:8px;border-radius:4px;width:${pct}%"></div></div> <b style="color:${col}">${pct}%</b></td>`+
    `<td${stale?' style="color:var(--err,#dc2626);font-weight:600"':''}>${v.last?fmt(v.last):'—'}${stale?' ⚠':''}</td></tr>`;}).join('');
  const el=document.getElementById('chHealth');if(!el)return;
  el.innerHTML=rows?`<div class="table-wrap"><table><thead><tr><th>渠道</th><th>活跃 / 总数</th><th>活跃占比</th><th>最近活动</th></tr></thead><tbody>${rows}</tbody></table></div>`
   :'<div class="empty">暂无来源数据</div>';
 }catch(e){const el=document.getElementById('chHealth');if(el)el.innerHTML='<div class="empty">加载失败</div>';}
}

let IDG_CATS=['当前联系人','身份','规范身份','合并候选联系人'];
let IDG_COLORS={whatsapp:'#25d366',instagram:'#e1306c',facebook:'#1877f2',messenger:'#0084ff',telegram:'#229ed9'};
async function renderIdentityGraphView(){
 let box=$('#identityGraphBox'),cid=S.cache.selectedContactId,items=S.cache.lastIdentities||[];
 if(!box)return;
 if(!cid||!items.length){box.innerHTML='<div class="empty">暂无身份数据，无法构建图谱</div>';return}
 if(!window.echarts){box.innerHTML='<div class="empty">图表库尚未加载，请稍后重试</div>';return}
 box.innerHTML='<div class="empty">正在构建身份图谱…</div>';
 let nodes=[{id:'c:'+cid,name:'联系人 '+cid.slice(0,8),symbolSize:46,category:0,itemStyle:{color:'#2563eb'}}];
 let links=[],canonMap={};
 items.forEach(r=>{let color=IDG_COLORS[(r.platform_code||'').toLowerCase()]||'#94a3b8';
  nodes.push({id:'i:'+r.contact_identity_id,name:r.identity_value,symbolSize:30,category:1,itemStyle:{color,borderColor:r.is_primary?'#f59e0b':'transparent',borderWidth:r.is_primary?3:0},raw:r});
  links.push({source:'c:'+cid,target:'i:'+r.contact_identity_id,lineStyle:{width:2,color:'#93c5fd'}});
  let cv=(r.canonical_value||r.identity_value||'').toLowerCase();
  if(cv){if(!canonMap[cv])canonMap[cv]={id:'k:'+cv,name:'规范: '+cv,items:[]};canonMap[cv].items.push(r)}});
 let others={};
 try{let d=await api('/api/v207/admin/contacts?limit=200'+qp());(d.items||[]).forEach(c=>{if(c.contact_id!==cid)others[c.contact_id]=c})}catch(e){}
 Object.values(canonMap).forEach(g=>{
  nodes.push({id:g.id,name:g.name,symbolSize:22,category:2,itemStyle:{color:'#f59e0b'},canon:g});
  g.items.forEach(r=>links.push({source:'i:'+r.contact_identity_id,target:g.id,lineStyle:{width:1,type:r.identity_value!==g.items[0].identity_value?'dashed':'solid',color:'#fbbf24'}}))});
 let ocIds=Object.keys(others).slice(0,30);
 await Promise.all(ocIds.map(async oc=>{try{
  let d2=await api(`/api/v207/admin/contacts/${encodeURIComponent(oc)}/identities${qp()}`);
  (d2.items||[]).forEach(r=>{let cv=(r.canonical_value||'').toLowerCase();
   if(canonMap[cv]){if(!nodes.find(n=>n.id==='c:'+oc)){let c=others[oc];nodes.push({id:'c:'+oc,name:'联系人 '+oc.slice(0,8)+(c.display_name?' ('+c.display_name+')':''),symbolSize:34,category:3,itemStyle:{color:'#64748b'},raw:c})}
    links.push({source:'c:'+oc,target:canonMap[cv].id,lineStyle:{type:'dashed',color:'#ef4444',width:2}})}})}catch(e){}}));
 box.innerHTML='<div id="identityGraphCanvas" style="width:100%;height:420px"></div>';
 let chart=echarts.init($('#identityGraphCanvas'));
 chart.setOption({tooltip:{formatter:p=>{if(p.dataType==='edge')return p.data.source+' → '+p.data.target+(p.data.lineStyle&&p.data.lineStyle.type==='dashed'?'<br><b>⚠ 疑似可合并</b>':'');
  let d=p.data;if(d.raw&&d.raw.identity_value)return `<b>${esc(d.raw.identity_value)}</b><br>平台: ${esc(d.raw.platform_name||'-')}<br>类型: ${esc(d.raw.identity_type||'-')}<br>规范值: ${esc(d.raw.canonical_value||'-')}<br>验证: ${esc(d.raw.verification_status||'-')}<br>首次: ${fmt(d.raw.first_seen_at)}<br>最后: ${fmt(d.raw.last_seen_at)}`;
  return esc(d.name)}},
  legend:{data:IDG_CATS,top:5},
  series:[{type:'graph',layout:'force',roam:true,draggable:true,categories:IDG_CATS.map((n,i)=>({name:n})),
   force:{repulsion:260,edgeLength:90},label:{show:true,fontSize:10,position:'right'},
   emphasis:{focus:'adjacency'},data:nodes,links:links}]});
 chart.on('click',p=>{let d=p.data;if(!d||d.category!==3||!d.raw)return;
  mergeContactPrompt(cid,d.raw)});
}

function renderDatabase(keepFocus=false){let d=S.cache.databaseSchema;if(!d)return;let q=S.cache.schemaQuery||'',cat=S.cache.schemaCategory||'all';let tables=d.tables.filter(t=>{if(cat!=='all'&&t.category!==cat)return false;if(!q)return true;let text=[t.name,t.label,t.purpose,...t.fields.flatMap(f=>[f.name,f.label,f.description,...f.tags])].join(' ').toLowerCase();return text.includes(q)});let sums=d.summary,issues=d.integrity.foreignKeyIssues||[];let cats=[{key:'all',label:'全部数据表',description:'展示运行数据库中的全部业务表',tableCount:sums.tableCount,fieldCount:sums.fieldCount},...d.categories];let cards=`<div class="cards"><div class="card"><span>Schema 版本</span><b>${esc(d.schemaVersion)}</b></div><div class="card"><span>业务表 / 字段</span><b>${sums.tableCount} / ${sums.fieldCount}</b></div><div class="card"><span>索引 / 物理外键</span><b>${sums.indexCount} / ${sums.physicalForeignKeyCount}</b></div><div class="card"><span>完整性检查</span><b style="color:${d.integrity.quickCheck==='ok'&&!issues.length?'var(--ok)':'var(--bad)'}">${esc(d.integrity.quickCheck)} · ${issues.length} 异常</b></div></div>`;;if(window.echarts&&d.auditTrend&&d.auditTrend.length){try{const tc=echarts.init(document.getElementById('trendChart'));tc.setOption({textStyle:{color:'#9aa4b2'},tooltip:{trigger:'axis'},grid:{left:40,right:20,top:20,bottom:30},xAxis:{type:'category',data:d.auditTrend.map(x=>x.day)},yAxis:{type:'value'},series:[{type:'line',smooth:true,areaStyle:{},data:d.auditTrend.map(x=>x.value)}]});window.addEventListener('resize',()=>tc.resize())}catch(e){console.warn('chart',e)}}else{const te=document.getElementById('trendChart');if(te)te.innerHTML='<p style="color:var(--muted);padding:20px">暂无近7日操作数据</p>'}let categoryHtml=`<div class="schema-cats">${cats.map(x=>`<button class="schema-cat ${cat===x.key?'active':''}" onclick="selectSchemaCategory('${esc(x.key)}')"><b>${esc(x.label)}</b><small>${esc(x.description)}</small><em>${x.tableCount} 张表 · ${x.fieldCount} 个字段</em></button>`).join('')}</div>`;let tools=`<div class="schema-tools"><input id="schemaQuery" class="select" value="${esc(q)}" placeholder="搜索表名、字段名或中文用途" oninput="filterSchema()"><span class="badge">当前 ${tables.length} 张表</span><button class="btn secondary small" onclick="resetSchemaFilter()">重置</button><button class="btn secondary small" onclick="loadPage()">刷新结构</button></div>`;let warning=!d.tables.some(t=>t.name==='custom_field_definitions'&&t.fields.some(f=>f.name==='options'))?'<div class="schema-note"><b class="schema-alert">结构提示</b><span><code>custom_field_definitions.options</code> 当前运行库不存在；如业务需要下拉或多选选项，应通过单独迁移补丁增加，不能由展示页面隐式修改。</span></div>':'';let list=tables.map(schemaTableHtml).join('')||'<div class="panel empty">没有符合条件的数据表或字段</div>';let relations=d.relations.filter(r=>cat==='all'||[r.fromTable,r.toTable].some(n=>d.tables.find(t=>t.name===n)?.category===cat));let relHtml=(()=>{let logic=relations.filter(r=>r.kind!=='physical'),phys=relations.filter(r=>r.kind==='physical');let card=r=>`<div class="schema-relation"><div>${schemaTag(r.kind==='physical'?'FK':'逻辑关联')} <code>${esc(r.fromTable)}.${esc(r.fromField)}</code> → <code>${esc(r.toTable)}.${esc(r.toField)}</code></div><p>${esc(r.description)}</p></div>`;return `<div class="panel"><div class="panel-head"><h3>逻辑关联</h3><span class="grow">由 API、RBAC 和组织隔离代码维护</span><span class="badge">${logic.length} 条</span></div><div class="schema-relations">${logic.map(card).join('')||'<div class="empty">无逻辑关联</div>'}</div></div><div class="panel"><div class="panel-head"><h3>物理外键</h3><span class="grow">由 SQLite 强制约束</span><span class="badge">${phys.length} 条</span></div><div class="schema-relations">${phys.map(card).join('')||'<div class="empty">无物理外键</div>'}</div></div>`})();$('#content').innerHTML=head('数据库结构中心','Schema 208 数据字典、字段释义、约束和实体关系 · 只读展示','<span class="status active">只读元数据</span>')+`<div class="schema-hero">${cards}${categoryHtml}${(d.notes||[]).map(n=>`<div class="schema-note"><b>说明</b><span>${esc(n)}</span></div>`).join('')}${warning}</div>${tools}<div class="schema-section-title"><h3>数据表与字段字典</h3><span class="badge">点击表卡片展开</span></div>${list}<div class="schema-section-title"><h3>关系与约束</h3><span class="badge">${relations.length} 条</span></div>${relHtml}`;if(keepFocus){let e=$('#schemaQuery');e?.focus();e?.setSelectionRange(q.length,q.length)}}
function schemaTableHtml(t){let fields=`<div class="table-wrap"><table class="schema-fields"><thead><tr><th>字段 / 中文名</th><th>类型</th><th>约束</th><th>默认值</th><th>字段作用与关联</th></tr></thead><tbody>${t.fields.map(f=>{let rel=[...(f.physicalRelations||[]),...(f.logicalRelations||[])].filter(r=>r.toTable&&r.toField).map(r=>`${r.kind==='physical'?'物理外键':'逻辑关联'}：${r.toTable}.${r.toField}${r.description?'（'+r.description+'）':''}`).join('；');return `<tr><td><code>${esc(f.name)}</code><br><b>${esc(f.label)}</b></td><td><code>${esc(f.type||'—')}</code></td><td><div class="schema-tags">${(f.tags||[]).map(schemaTag).join('')||'<span class="schema-tag">可空</span>'}</div></td><td><code>${esc(f.default??'—')}</code></td><td>${esc(f.description)}${rel?`<br><span class="schema-code">${esc(rel)}</span>`:''}</td></tr>`}).join('')}</tbody></table></div>`;let idx=t.indexes?.length?`<div class="schema-section-title"><h3>索引</h3></div><div class="schema-relations">${t.indexes.map(i=>`<div class="schema-relation"><code>${esc(i.name)}</code> ${i.unique?schemaTag('UNIQUE'):''}<p>${esc((i.fields||[]).join(', ')||'表达式或自动索引')}</p></div>`).join('')}</div>`:'';return `<details class="schema-table" ${S.cache.schemaQuery?'open':''}><summary><div class="schema-title"><b>${esc(t.label)}</b><code>${esc(t.name)}</code></div><div class="schema-purpose">${esc(t.purpose)}</div><span class="badge">${t.fieldCount} 字段</span><span class="badge">${esc(t.scopeType||'结构元数据')}</span></summary><div class="schema-body">${fields}${idx}</div></details>`}

function renderDatabasePreviewCards(){

async function loadDatabaseRows(name,page=1,pageSize){
 let box=$('#databaseRows');if(!box)return;pageSize=pageSize||Number($('#dbPreviewPageSize')?.value||25);box.className='panel';box.innerHTML='正在安全加载…';
 try{
  let d=await api('/api/v207/admin/database-tables/'+encodeURIComponent(name)+'/rows'+qp()+'&page='+page+'&pageSize='+pageSize),items=d.items||[],pg=d.pagination||{},columns=d.columns||[],keys=columns.map(x=>x.name);
  if(!keys.length)keys=[...new Set(items.flatMap(x=>Object.keys(x)))];let encoded=encodeURIComponent(name),modeLabel={full:'普通预览',masked:'自动脱敏',restricted:'仅结构'}[d.previewMode]||'只读';
  let header=`<div class="panel-head"><h3><code>${esc(name)}</code></h3><span class="badge">${esc(d.categoryLabel||'其他')}</span><span class="grow"></span><span class="status ${d.restricted?'disabled':d.previewMode==='masked'?'pending':'active'}">${modeLabel} · ${Number(pg.total||0).toLocaleString()} 条</span></div><div class="toolbar"><span>企业范围：${esc(d.scopedBy||'未知')}</span>${(d.maskedFields||[]).length?`<span class="badge">掩码 ${(d.maskedFields||[]).length} 字段</span>`:''}${(d.omittedFields||[]).length?`<span class="badge">剔除 ${(d.omittedFields||[]).length} 字段</span>`:''}<span class="grow"></span><label>每页 <select id="dbPreviewPageSize" class="select" onchange="loadDatabaseRows(decodeURIComponent('${encoded}'),1,Number(this.value))"><option ${pageSize===20?'selected':''}>20</option><option ${pageSize===25?'selected':''}>25</option><option ${pageSize===50?'selected':''}>50</option><option ${pageSize===100?'selected':''}>100</option></select></label></div>`;
  if(d.restricted){let structure=columns.length?`<table class="tbl"><thead><tr><th>字段</th><th>安全处理</th></tr></thead><tbody>${columns.map(x=>`<tr><td><code>${esc(x.name)}</code></td><td>${x.mode==='mask'?'掩码':'允许显示结构'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">没有可公开的字段结构</div>';box.innerHTML=header+`<div class="error" style="margin-bottom:12px">${esc(d.restrictedReason||'该表禁止记录预览')}</div>`+structure;return}
  let table=items.length?`<div style="overflow:auto"><table class="tbl"><thead><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${items.map(row=>`<tr>${keys.map(k=>`<td>${esc(row[k]===null?'—':typeof row[k]==='object'?JSON.stringify(row[k]):String(row[k]??''))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">当前企业范围内暂无记录</div>';
  let pages=pg.pages||Math.ceil((pg.total||0)/(pg.pageSize||pageSize))||1;let nav=`<div class="toolbar"><button class="btn secondary small" ${page<=1?'disabled':''} onclick="loadDatabaseRows(decodeURIComponent('${encoded}'),${page-1},${pageSize})">上一页</button><span>第 ${page} / ${pages} 页</span><button class="btn secondary small" ${page>=pages?'disabled':''} onclick="loadDatabaseRows(decodeURIComponent('${encoded}'),${page+1},${pageSize})">下一页</button></div>`;box.innerHTML=header+table+nav;
 }catch(e){box.className='panel error';box.textContent=e.message}
}

 idTypes:[],
 purposes:[],
 async start(){
  this.step=1;this.data={platformId:'',platformName:'',purpose:'chat',channelTypeId:'',channelName:'',displayName:'',identity:'',identityType:'login',teamId:''};
  try{const [dd,td]=await Promise.all([runtimeDictionary(),api('/api/v207/admin/teams'+qp(),{contextGuard:false})]);S.cache.teams=td.items||[];this.platforms=Object.entries(dd.platforms||{}).map(([id,x])=>({id,name:x.platform_name}));this.channels=dd.platforms||{};this.idTypes=(dd.identity_types||[]).map(x=>[x.value,x.label]);this.purposes=(dd.account_purposes||[]).map(x=>[x.value,x.label,x.requiresChannel?1:0]);if(!this.platforms.length)return toast('没有启用的平台，请先完成平台配置',1);this.render()}catch(e){toast(e.message||'平台字典加载失败',1)}
 },

async function members(id,name){
 const d=await api(`/api/v207/admin/teams/${encodeURIComponent(id)}/members${qp()}`);
 const items=d.items||[];
 const html=`<div class="member-add-panel">

   <button type="button" class="btn small" data-member-add>添加成员</button>
  </div>
 </div>`+table([
  ['姓名',x=>esc(x.display_name||x.login_name||'—')],['登录名',x=>esc(x.login_name||'—')],
  ['部门',x=>esc(x.department_name||'—')],['职位',x=>esc(x.position_name||'—')],['角色',x=>esc(x.role_names||'—')],
  ['成员类型',x=>esc(TEAM_MEMBER_TYPES[x.membership_type]||x.membership_type||'—')],
  ['主团队','is_primary',x=>x.is_primary?'是':'否'],['状态','user_status',x=>status(x.user_status||x.status)]
 ],items,x=>`<button type="button" class="btn secondary small" data-member-edit data-user-id="${esc(x.user_id)}">编辑关系</button> ${x.is_primary?'':`<button type="button" class="btn secondary small" data-member-primary data-user-id="${esc(x.user_id)}">设为主团队</button> <button type="button" class="btn danger small" data-member-remove data-user-id="${esc(x.user_id)}">移出</button>`}`);
 openReadonlyModal(`团队成员 — ${name}（${items.length}）`,html,{
  onOpened:body=>{
   document.querySelector('#modal .modal')?.classList.add('team-members-modal');
   const search=body.querySelector('#memberSearch'),select=body.querySelector('#memberUser'),hint=body.querySelector('#memberSearchHint');
   let timer=0,serial=0;
   const runSearch=async()=>{
    const term=search.value.trim(),seq=++serial;
    if(!term){select.innerHTML='<option value="">请先输入搜索关键词</option>';hint.textContent='输入关键词从服务器搜索，最多显示 50 条';return}
    hint.textContent='正在搜索…';
    try{
     const r=await api(`/api/v207/admin/teams/${encodeURIComponent(id)}/member-candidates${qp({q:term})}`);
     if(seq!==serial)return;
     const rows=r.items||[];
     select.innerHTML='<option value="">选择用户</option>'+rows.map(x=>`<option value="${esc(x.user_id)}">${esc(x.display_name||x.login_name)}（${esc(x.login_name)}） · ${esc(x.department_name||'未分部门')} · ${esc(x.position_name||'未设职位')}</option>`).join('');
     hint.textContent=rows.length?`找到 ${rows.length} 名可添加用户`:'没有匹配的可添加用户';
    }catch(err){if(seq===serial)hint.textContent=err.message||'搜索失败'}
   };
   search.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(runSearch,300)});
   body.addEventListener('click',async e=>{
    const add=e.target.closest('[data-member-add]');
    if(add){add.disabled=true;try{await addTeamMember(id,name)}catch(err){toast(err.message||'添加成员失败',1)}finally{if(add.isConnected)add.disabled=false}return}
    const edit=e.target.closest('[data-member-edit]');
    if(edit){const row=items.find(x=>x.user_id===edit.dataset.userId);if(row)editTeamMember(id,name,row);return}
    const primary=e.target.closest('[data-member-primary]');
    if(primary){const row=items.find(x=>x.user_id===primary.dataset.userId);if(row)transferPrimaryTeam(id,name,row);return}
    const remove=e.target.closest('[data-member-remove]');
    if(remove){const row=items.find(x=>x.user_id===remove.dataset.userId);if(row)removeTeamMember(id,name,row)}
   });
  }
 });
}

// 把毫秒时间戳转换为 <input type="datetime-local"> 需要的本地时间字符串
function _tsToLocalInput(ts){
 if(ts===undefined||ts===null||ts==='')return '';
 let n=Number(ts);
 if(!Number.isFinite(n)||n<=0)return '';
 if(n<1e12)n*=1000; // 兼容历史秒级数据
 const d=new Date(n);
 if(Number.isNaN(d.getTime()))return '';
 const pad=x=>String(x).padStart(2,'0');
 return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
// 解析 datetime-local 字符串为毫秒时间戳；空值返回 null
function _localInputToTs(v){
 if(v===undefined||v===null||v==='')return null;
 const d=new Date(v);
 const n=d.getTime();
 return Number.isNaN(n)?null:n;
}
// 把毫秒时间戳转换为 <input type="date"> 需要的 YYYY-MM-DD 字符串
function _tsToLocalDate(ts){
 if(ts===undefined||ts===null||ts==='')return '';
 let n=Number(ts);
 if(!Number.isFinite(n)||n<=0)return '';
 if(n<1e12)n*=1000;
 const d=new Date(n);
 if(Number.isNaN(d.getTime()))return '';
 const pad=x=>String(x).padStart(2,'0');
 return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
// 自定义日历选择器（不依赖浏览器原生 picker，所有浏览器一致体验）
function openCalendar(trigger,hidden){
 const existing=document.getElementById('calendarPopup');
 if(existing){existing.remove();document.removeEventListener('mousedown',_calOutside,true);document.removeEventListener('keydown',_calEsc,true)}
 const pad=x=>String(x).padStart(2,'0');
 const parse=v=>{const m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return null;return new Date(Number(m[1]),Number(m[2])-1,Number(m[3]))};
 const today=new Date();today.setHours(0,0,0,0);
 let cur=parse(hidden.value)||new Date(today);
 const sel=parse(hidden.value);
 const popup=document.createElement('div');
 popup.id='calendarPopup';popup.className='calendar-popup';
 const render=()=>{
  const y=cur.getFullYear(),m=cur.getMonth();
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  const startDow=first.getDay(); // 0=Sun
  const prevLast=new Date(y,m,0).getDate();
  const cells=[];
  for(let i=startDow-1;i>=0;i--)cells.push({y:m===0?y-1:y,m:m===0?11:m-1,d:prevLast-i,muted:true});
  for(let d=1;d<=last.getDate();d++)cells.push({y,m,d,muted:false});
  while(cells.length%7!==0||cells.length<42){const n=cells.length-prevLast-(startDow-1);cells.push({y:m===11?y+1:y,m:m===11?0:m+1,d:n,muted:true})}
  popup.innerHTML=`
   <div class="cal-nav">
    <button type="button" data-cal-prev-year aria-label="上一年">«</button>
    <button type="button" data-cal-prev-month aria-label="上月">‹</button>
    <div class="cal-title">${y} 年 ${pad(m+1)} 月</div>
    <button type="button" data-cal-next-month aria-label="下月">›</button>
    <button type="button" data-cal-next-year aria-label="下一年">»</button>
   </div>
   <div class="cal-grid">
    ${['日','一','二','三','四','五','六'].map(x=>`<div class="cal-dow">${x}</div>`).join('')}
    ${cells.map(c=>{
     const dStr=`${c.y}-${pad(c.m+1)}-${pad(c.d)}`;
     const isToday=dStr===`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
     const isSel=sel&&dStr===`${sel.getFullYear()}-${pad(sel.getMonth()+1)}-${pad(sel.getDate())}`;
     return `<button type="button" class="cal-day${c.muted?' muted':''}${isToday?' today':''}${isSel?' selected':''}" data-d="${dStr}">${c.d}</button>`;
    }).join('')}
   </div>
   <div class="cal-foot">
    <button type="button" data-cal-today>今天</button>
    <button type="button" data-cal-clear>清除</button>
    <button type="button" class="primary" data-cal-close>关闭</button>
   </div>`;
 };
 render();
 // 计算弹层位置（紧贴触发按钮下方，溢出视口则翻转）
 const r=trigger.getBoundingClientRect();
 popup.style.left=(r.left+window.scrollX)+'px';
 popup.style.top=(r.bottom+window.scrollY+4)+'px';
 document.body.appendChild(popup);
 const overflow=popup.getBoundingClientRect();
 if(overflow.right>window.innerWidth-8){popup.style.left=(window.innerWidth-popup.offsetWidth-8+window.scrollX)+'px'}
 if(overflow.bottom>window.innerHeight-8){popup.style.top=(r.top+window.scrollY-popup.offsetHeight-4)+'px'}
 // 事件
 popup.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  e.preventDefault();e.stopPropagation();
  if(b.dataset.calPrevYear!==undefined)cur=new Date(cur.getFullYear()-1,cur.getMonth(),1);
  else if(b.dataset.calPrevMonth!==undefined)cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);
  else if(b.dataset.calNextMonth!==undefined)cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  else if(b.dataset.calNextYear!==undefined)cur=new Date(cur.getFullYear()+1,cur.getMonth(),1);
  else if(b.dataset.calToday!==undefined){const t=new Date();cur=new Date(t.getFullYear(),t.getMonth(),1);hidden.value=`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;hidden.dispatchEvent(new Event('change',{bubbles:true}));close()}
  else if(b.dataset.calClear!==undefined){hidden.value='';hidden.dispatchEvent(new Event('change',{bubbles:true}));close()}
  else if(b.dataset.calClose!==undefined){close();return}
  else if(b.dataset.d){hidden.value=b.dataset.d;hidden.dispatchEvent(new Event('change',{bubbles:true}));close();return}
  render();
 });
 function close(){popup.remove();document.removeEventListener('mousedown',_calOutside,true);document.removeEventListener('keydown',_calEsc,true)}
 function _calOutside(ev){if(!popup.contains(ev.target)&&ev.target!==trigger&&!trigger.contains(ev.target))close()}
 function _calEsc(ev){if(ev.key==='Escape')close()}
 setTimeout(()=>{document.addEventListener('mousedown',_calOutside,true);document.addEventListener('keydown',_calEsc,true)},0);
}

function _campaignPayload(o,isUpdate){
 const base={
  name:String(o.name||'').trim(),
  code:String(o.code||'').trim()||undefined,
  workspaceId:String(o.workspaceId||'').trim(),
  type:o.campaign_type||'marketing',
  status:o.status||'draft',
  platformId:o.platformId||undefined,
  channelAccountId:o.channelAccountId||undefined,
  businessLineId:o.businessLineId||undefined,
  marketId:o.marketId||undefined,
  startAt:_localInputToTs(o.start_at),
  endAt:_localInputToTs(o.end_at)
 };
 if(!isUpdate)delete base.code;
 if(isUpdate){
  base.code=String(o.code||'').trim()||undefined;
  base.reason=String(o.reason||'').trim();
 }
 // 清理 undefined
 Object.keys(base).forEach(k=>{if(base[k]===undefined)delete base[k]});
 return base;
}
async function createCampaign(){
 try{
  const deps=await _loadCampaignDeps();
  if(!deps.workspaces.length){toast('当前企业暂无工作区，请先创建工作区',1);return}
  openFormModal('新建营销活动',_buildCampaignFields({},deps),async (_,form)=>{
   const o=modalFormValues(form,_buildCampaignFields({},deps));
   const body=_campaignPayload(o,false);
   if(!body.name){toast('请填写活动名称',1);return false}
   if(!body.workspaceId){toast('请选择所属工作区',1);return false}
   if(body.startAt&&body.endAt&&body.endAt<body.startAt){toast('结束时间不能早于开始时间',1);return false}
   try{
    await api('/api/v207/admin/campaigns'+qp(),{method:'POST',body});
    toast('活动创建成功');
    closeModal();await loadPage();
   }catch(err){toast(err.message||'创建失败',1)}
   return false;
  },{html:_buildCampaignFields({},deps).map(modalFieldHtml).join(''),submitText:'创建活动',reload:false,
   onOpened:(body,form)=>{
    // 平台 ↔ 渠道账号联动：选择平台后，自动筛选账号选项；如已选账号同步反填平台
    const pidSel=body.querySelector('select[name=platformId]');
    const accSel=body.querySelector('select[name=channelAccountId]');
    if(pidSel&&accSel){
     const allAccounts=deps.accounts.map(a=>({value:a.channel_account_id,label:`${a.display_name||a.channel_account_id} · ${a.platform_name||a.platform_code||'未分类'}${a.status==='active'?'':'（已停用）'}`}));
     const refreshAcc=()=>{
      const pid=pidSel.value;
      const prev=accSel.value;
      const list=pid?allAccounts.filter(a=>{const item=deps.accounts.find(x=>x.channel_account_id===a.value);return item&&item.platform_id===pid}):[{value:'',label:'不绑定账号'},...allAccounts];
      accSel.innerHTML=list.map(x=>`<option value="${esc(x.value)}">${esc(x.label)}</option>`).join('');
      accSel.value=list.some(x=>x.value===prev)?prev:'';
     };
     pidSel.addEventListener('change',refreshAcc);
     accSel.addEventListener('change',()=>{
      if(!accSel.value)return;
      const acc=deps.accounts.find(a=>a.channel_account_id===accSel.value);
      if(acc&&acc.platform_id&&pidSel.value!==acc.platform_id){pidSel.value=acc.platform_id;refreshAcc()}
     });
    }
   }});
 }catch(e){toast(e.message||'活动表单加载失败',1)}
}

function modalFieldHtml(field){

  control=`<select name="${name}"${required}${disabled}>${f.placeholder?`<option value="">${esc(f.placeholder)}</option>`:''}${options}</select>`;
 }else if(f.type==='textarea'){
  control=`<textarea name="${name}" rows="${Number(f.rows)||3}"${required}${disabled}${placeholder}>${esc(value)}</textarea>`;
 }else if(f.type==='color-palette'){
  const colors=f.colors||['#64748b','#2563eb','#7c3aed','#db2777','#dc2626','#ea580c','#ca8a04','#16a34a','#0891b2'];

 }else if(f.type==='date'){
  control=`<span class="dt-picker" data-name="${name}">
   <button type="button" class="dt-trigger" data-cal-trigger aria-haspopup="dialog">

  control=`<input name="${name}" type="${type}" value="${esc(value)}"${required}${disabled}${placeholder}${min}${max}${step}>`;

function computeDepth(items,parentKey='parent_id'){
 let map={};items.forEach(r=>{map[r[parentKey]||null]=(map[r[parentKey]||null]||0)+1});
 let depthMap={};
 function depth(id){
  if(depthMap[id]!==undefined)return depthMap[id];
  let node=items.find(r=>r.department_id===id||r.business_line_id===id||r.market_id===id);
  if(!node||!node[parentKey])return 0;
  return depthMap[id]=(depth(node[parentKey])+1);
 }
 return items.map(r=>depth(r.department_id||r.business_line_id||r.market_id));
}
function renderStructureCharts(deps,lines,mkts){
 if(!window.echarts)return;
 // 1. 部门层级深度分布
 let dEl=document.querySelector('#struDeptChart');
 if(dEl){
  dEl.innerHTML='';
  if(window._struDept)try{window._struDept.dispose()}catch(e){}
  let depths=computeDepth(deps||[],'parent_department_id');
  let dist={};
  depths.forEach(d=>{let k=d===0?'根':`L${d+1}`;dist[k]=(dist[k]||0)+1});

function buildTree(items,idKey,parentKey,nameKey){
  const map={},roots=[];
  (items||[]).forEach(it=>{map[it[idKey]]={name:it[nameKey]||it.name||'(未命名)',children:[],raw:it};});
  (items||[]).forEach(it=>{
    const node=map[it[idKey]],p=it[parentKey];
    if(p&&map[p])map[p].children.push(node);else roots.push(node);
  });
  const prune=n=>{if(!n.children.length)delete n.children;else n.children.forEach(prune);};
  roots.forEach(prune);
  return roots.length===1?roots[0]:(roots.length?{name:'全部',children:roots}:{name:'（暂无数据）'});
}

  el.innerHTML='';
  if(window._orgTreeChart){try{window._orgTreeChart.dispose();}catch(e){}}
  const chart=echarts.init(el);window._orgTreeChart=chart;
  // ---- 树状图美化 V2：层级渐变配色 + 发光 + 分层入场 ----
  function nodeColor(d){const dep=d.depth||0;return ['#6366f1','#8b5cf6','#ec4899','#f59e0b','#10b981'][dep%5];}
  const __parentMap=new Map();
  (function index(n,p){__parentMap.set(n.name,p?p.name:null);if(n.children)n.children.forEach(c=>index(c,n));})(tree);
  function decorate(n){n.itemStyle={color:nodeColor(n),
      borderColor:'rgba(255,255,255,.25)',borderWidth:2,
      shadowColor:nodeColor(n),shadowBlur:12};
    if(n.children){n.children.forEach(c=>decorate(c));}else{
      n.itemStyle={color:'#34d399',borderColor:'rgba(52,211,153,.35)',borderWidth:5,shadowColor:'rgba(52,211,153,.5)',shadowBlur:10};}}
  decorate(tree);
  chart.setOption({
    color:['#6366f1'],
    tooltip:{trigger:'item',backgroundColor:'rgba(17,20,34,.94)',borderColor:'rgba(129,140,248,.35)',
      borderWidth:1,padding:[10,14],textStyle:{color:'#e6e9f2',fontSize:13},
      extraCssText:'border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.45);backdrop-filter:blur(6px);',
      formatter:function(p){const d=p.data;let path=[d.name];let par=__parentMap.get(d.name);
        while(par){path.unshift(par);par=__parentMap.get(par);}
        return '<b style="font-size:14px">'+d.name+'</b><br><span style="color:#8a93a6">层级路径：</span>'+path.join(' <span style="color:#6366f1">›</span> ');}},
    series:[{type:'tree',data:[tree],top:'8%',left:'12%',bottom:'8%',right:'22%',
      symbol:'circle',symbolSize:16,initialTreeDepth:-1,roam:false,
      lineStyle:{color:'rgba(148,163,184,.4)',width:1.5,curveness:.6},
      label:{position:'left',verticalAlign:'middle',align:'right',fontSize:13,
        fontWeight:600,color:'#dbe1ee',distance:9,
        textBorderColor:'rgba(0,0,0,.4)',textBorderWidth:2},
      leaves:{label:{position:'right',verticalAlign:'middle',align:'left',fontSize:12,
        fontWeight:400,color:'#9aa3b5',distance:9}},
      emphasis:{focus:'ancestor',blurScope:'parent',
        lineStyle:{width:3,color:'#a5b4fc',shadowColor:'rgba(165,180,252,.8)',shadowBlur:8},
        itemStyle:{shadowBlur:22}},
      expandAndCollapse:true,
      animationDuration:700,animationDurationUpdate:450,
      animationEasing:'cubicOut',animationEasingUpdate:'cubicInOut'}]});
  window.addEventListener('resize',()=>chart.resize());
}
boot();
</script></body></html>
