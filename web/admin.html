/* === V208.8.8 Phase 3 客户运营看板样式 (粉色主题) === */
.ops-page{display:flex;flex-direction:column;gap:var(--ops-stack-gap)}
.ops-greeting{display:flex;align-items:center;gap:14px;padding:18px 22px;background:linear-gradient(135deg,rgba(236,72,153,.10),rgba(139,92,246,.06)),var(--panel);border:1px solid var(--line);border-radius:var(--ops-card-radius);box-shadow:var(--ops-shadow-pink)}
.ops-greeting .hi{font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--pink),var(--pink2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ops-greeting .meta{color:var(--muted);font-size:13px;margin-top:3px}
.ops-greeting .scope{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.ops-greeting .scope .pill{padding:4px 10px;border-radius:999px;background:var(--ops-pill-bg);color:var(--text)}
.ops-kpis{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:13px}
.ops-kpi{padding:var(--ops-kpi-pad);background:var(--panel);border:1px solid var(--line);border-radius:var(--ops-card-radius);position:relative;overflow:hidden}
.ops-kpi .label{color:var(--muted);font-size:12px;letter-spacing:.4px}
.ops-kpi .value{font-size:30px;font-weight:800;margin-top:6px;background:linear-gradient(135deg,var(--pink),var(--pink2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ops-kpi .delta{display:inline-flex;align-items:center;gap:4px;font-size:12px;margin-top:8px;padding:2px 8px;border-radius:999px}
.ops-kpi .delta.up{color:#16a34a;background:#16a34a18}
.ops-kpi .delta.down{color:#dc2626;background:#dc262618}
.ops-kpi .sparkline{margin-top:10px;height:30px}
.ops-kpi .sparkline svg{width:100%;height:100%;display:block}
.ops-surface{display:grid;grid-template-columns:5fr 7fr;gap:14px}
.ops-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--ops-card-radius);padding:16px 18px;display:flex;flex-direction:column;min-width:0}
.ops-card .title{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ops-card .title .badge{margin-left:auto}
.ops-queue-tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.ops-queue-tab{padding:6px 12px;border-radius:999px;background:var(--ops-pill-bg);color:var(--muted);cursor:pointer;font-size:13px;border:1px solid transparent}
.ops-queue-tab.active{background:var(--ops-pill-bg-active);color:#fff;font-weight:600;box-shadow:var(--ops-shadow-pink)}
.ops-queue-tab .count{margin-left:5px;font-weight:700;opacity:.85}
.ops-queue-item{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:.15s}
.ops-queue-item:hover{border-color:var(--pink);box-shadow:var(--ops-shadow-pink);transform:translateY(-1px)}
.ops-queue-item .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;display:grid;place-items:center;font-weight:700}
.ops-queue-item .name{font-weight:600;font-size:14px}
.ops-queue-item .meta{color:var(--muted);font-size:12px;margin-top:2px}
.ops-queue-item .when{font-size:12px;color:var(--muted);white-space:nowrap}
.ops-queue-item.due{background:var(--ops-today-bg)}
.ops-queue-item.due .when{color:var(--pink2);font-weight:600}
.ops-queue-item.overdue{background:linear-gradient(135deg,#fff5f5 0%,#fecaca 100%)}
html[data-theme=light] .ops-queue-item.overdue{background:linear-gradient(135deg,#fef2f2,#fecaca)}
.ops-queue-item.overdue .when{color:#b91c1c;font-weight:700}
.ops-queue-actions{display:flex;gap:6px}
.ops-queue-actions .btn{padding:5px 10px;font-size:12px}
.ops-funnel{display:grid;grid-template-columns:repeat(4,minmax(var(--ops-funnel-min),1fr));gap:10px}
.ops-funnel-col{padding:14px 12px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);text-align:center;position:relative}
.ops-funnel-col .stage{font-size:12px;color:var(--muted);letter-spacing:.4px}
.ops-funnel-col .count{font-size:26px;font-weight:800;margin-top:5px}
.ops-funnel-col.s1{background:linear-gradient(135deg,#fff5fa,#fce7f3);border-color:#fbcfe8}
.ops-funnel-col.s2{background:linear-gradient(135deg,#fce7f3,#f9a8d4);border-color:#f9a8d4;color:#9d174d}
.ops-funnel-col.s3{background:linear-gradient(135deg,#f9a8d4,#ec4899);border-color:#ec4899;color:#fff}
.ops-funnel-col.won{background:linear-gradient(135deg,#ec4899,#be185d);border-color:#be185d;color:#fff}
html[data-theme=light] .ops-funnel-col.s2{color:#9d174d}
html[data-theme=light] .ops-funnel-col.s3{color:#fff}
.ops-funnel-col .sparkline{height:34px;margin-top:8px}
.ops-funnel-col .sparkline svg{width:100%;height:100%}
.ops-funnel-col.clickable{cursor:pointer}
.ops-funnel-col.clickable:hover{transform:translateY(-2px);box-shadow:var(--ops-shadow-pink)}
.ops-funnel-col.clickable.active{border:2px solid #be185d;box-shadow:0 0 0 3px rgba(190,24,93,.18),var(--ops-shadow-pink)}
.ops-funnel-col.clickable:active{transform:translateY(0)}
.ops-funnel-col.clickable::after{content:"点击下钻";position:absolute;top:6px;right:6px;font-size:10px;background:rgba(255,255,255,.7);color:#9d174d;padding:1px 6px;border-radius:6px;opacity:0;transition:opacity .2s}
.ops-funnel-col.clickable:hover::after{opacity:1}
.ops-row-clickable{cursor:pointer}
.ops-row-clickable:hover{background:var(--pink-50,#fdf2f8)}
.list .row.clickable{cursor:pointer;transition:background .15s}
.list .row.clickable:hover{background:var(--pink-50,#fdf2f8)}
.ops-funnel-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;margin:0 0 12px 0;background:var(--pink-100);color:var(--pink-700);border-radius:20px;font-size:13px;font-weight:500;border:1px solid #fbcfe8}
.ops-funnel-pill .close-x{background:none;border:none;color:var(--pink-700);cursor:pointer;padding:0 4px;font-size:14px;line-height:1}
.ops-funnel-pill .close-x:hover{color:#be185d}
.ops-insights{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}
.ops-insights .ops-card{min-height:200px}
.ops-insights .list{display:flex;flex-direction:column;gap:8px;max-height:240px;overflow:auto}
.ops-insights .list .row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.ops-insights .list .row:last-child{border-bottom:0}
.ops-insights .list .row .v{color:var(--pink2);font-weight:600}
.ops-insights .empty{text-align:center;padding:30px 10px;color:var(--muted);font-size:13px}
.ops-insights .pulse{height:90px}
.ops-insights .pulse svg{width:100%;height:100%}
.ops-filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--ops-card-radius)}
.ops-filters .group-label{color:var(--muted);font-size:12px;margin-right:4px;font-weight:600}
.ops-filters .chip{padding:5px 11px;border-radius:999px;background:var(--ops-pill-bg);color:var(--text);cursor:pointer;font-size:12px;border:1px solid transparent}
.ops-filters .chip:hover{border-color:var(--pink)}
.ops-filters .chip.active{background:var(--ops-pill-bg-active);color:#fff;font-weight:600;border-color:transparent}
.ops-filters .grow{flex:1}
.ops-filters .clear{color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;background:transparent}
.ops-drawer{position:fixed;inset:0 0 0 auto;width:var(--ops-drawer-width);max-width:96vw;background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 30px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .25s ease;z-index:25;display:flex;flex-direction:column}
.ops-drawer.open{transform:translateX(0)}
.ops-drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:24;opacity:0;transition:opacity .25s ease;cursor:pointer}
.ops-drawer-backdrop.show{opacity:1}
.ops-drawer .head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.ops-drawer .head .who{font-weight:700;font-size:16px}
.ops-drawer .head .close{margin-left:auto;cursor:pointer;color:var(--muted);font-size:18px;background:transparent}
.ops-drawer .body{padding:16px 18px;overflow:auto;flex:1}
.ops-drawer .section{margin-bottom:16px}
.ops-drawer .section h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.ops-drawer .section .kv{display:grid;grid-template-columns:84px 1fr;gap:6px 10px;font-size:13px}
.ops-drawer .section .kv span{color:var(--muted)}
.ops-drawer .empty-state{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:24px}
.ops-phase-placeholder{padding:14px 18px;background:linear-gradient(135deg,var(--pink-50),var(--pink-100));border:1px dashed var(--pink-200);border-radius:var(--ops-card-radius);color:var(--pink-700);font-size:13px;text-align:center}
.ops-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:320px;gap:16px;color:var(--muted);padding:40px}
.ops-loading-icon{font-size:48px;animation:ops-pulse 1.5s ease-in-out infinite}
@keyframes ops-pulse{0%,100%{opacity:1}50%{opacity:.4}}
@media(max-width:1100px){.ops-surface{grid-template-columns:1fr}.ops-funnel{grid-template-columns:repeat(2,1fr)}.ops-kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.ops-insights{grid-template-columns:1fr}.ops-kpis{grid-template-columns:1fr 1fr}.ops-funnel{grid-template-columns:1fr 1fr}}

/* V208.8.8 运营看板可读性与筛选反馈 */
.ops-insights .list .row.clickable{border-radius:8px;padding:8px 9px;outline:none;color:var(--text)}
.ops-insights .list .row.clickable:hover,.ops-insights .list .row.clickable:focus-visible{background:#fce7f3;color:#3f2637;box-shadow:inset 0 0 0 1px #f9a8d4}
.ops-insights .list .row.clickable:hover small,.ops-insights .list .row.clickable:focus-visible small{color:#6b435b!important}
.ops-insights .list .row.clickable:hover .v,.ops-insights .list .row.clickable:focus-visible .v{color:#9d174d!important;font-weight:800}
.ops-insights .list .row.clickable:active{background:#f9a8d4;color:#3f2637}
.ops-filters.loading{opacity:.72;pointer-events:none;position:relative}
.ops-filters.loading::after{content:'筛选中…';font-size:12px;color:var(--pink);font-weight:700}

function opsRelativeTime(value,fallback=''){
 let ts;
 if(typeof value==='number')ts=value<1e12?value*1000:value;
 else if(value!==null&&value!==undefined&&String(value).trim()!==''){
  const raw=String(value).trim();
  ts=/^\d+$/.test(raw)?Number(raw):Date.parse(raw);
  if(/^\d+$/.test(raw)&&ts<1e12)ts*=1000;
 }
 if(!Number.isFinite(ts))return /^-\d+\s*(分钟|小时|天)前$/.test(String(fallback).trim())?'刚刚':(fallback||'时间未知');
 const diff=Math.max(0,Date.now()-ts),minutes=Math.floor(diff/60000);
 if(minutes<1)return '刚刚';
 if(minutes<60)return `${minutes} 分钟前`;
 const hours=Math.floor(minutes/60);
 if(hours<24)return `${hours} 小时前`;
 return `${Math.floor(hours/24)} 天前`;
}

v class="schema-tools"><input id="schemaQuery" class="select" value="${esc(q)}" placeholder="搜索表名、字段名或中文用途" oninput="filterSchema()"><span class="badge">当前 ${tables.length} 张表</span><button class="btn secondary small" onclick="resetSchemaFilter()">重置</button><button class="btn secondary small" onclick="loadPage()">刷新结构</button></div>`;let warning=!d.tables.some(t=>t.name==='custom_field_definitions'&&t.fields.some(f=>f.name==='options'))?'<div class="schema-note"><b class="schema-alert">结构提示</b><span><code>custom_field_definitions.options</code> 当前运行库不存在；如业务需要下拉或多选选项，应通过单独迁移补丁增加，不能由展示页面隐式修改。</span></div>':'';let list=tables.map(schemaTableHtml).join('')||'<div class="panel empty">没有符合条件的数据表或字段</div>';let relations=d.relations.filter(r=>cat==='all'||[r.fromTable,r.toTable].some(n=>d.tables.find(t=>t.name===n)?.category===cat));let relHtml=(()=>{let logic=relations.filter(r=>r.kind!=='physical'),phys=relations.filter(r=>r.kind==='physical');let card=r=>`<div class="schema-relation"><div>${schemaTag(r.kind==='physical'?'FK':'逻辑关联')} <code>${esc(r.fromTable)}.${esc(r.fromField)}</code> → <code>${esc(r.toTable)}.${esc(r.toField)}</code></div><p>${esc(r.description)}</p></div>`;return `<div class="panel"><div class="panel-head"><h3>逻辑关联</h3><span class="grow">由 API、RBAC 和组织隔离代码维护</span><span class="badge">${logic.length} 条</span></div><div class="schema-relations">${logic.map(card).join('')||'<div class="empty">无逻辑关联</div>'}</div></div><div class="panel"><div class="panel-head"><h3>物理外键</h3><span class="grow">由 SQLite 强制约束</span><span class="badge">${phys.length} 条</span></div><div class="schema-relations">${phys.map(card).join('')||'<div class="empty">无物理外键</div>'}</div></div>`})();$('#content').innerHTML=head('数据库结构中心','Schema 208 数据字典、字段释义、约束和实体关系 · 只读展示','<span class="status active">只读元数据</span>')+`<div class="schema-hero">${cards}${categoryHtml}${(d.notes||[]).map(n=>`<div class="schema-note"><b>说明</b><span>${esc(n)}</span></div>`).join('')}${warning}</div>${tools}<d function schemaTableHtml(t){let fields=`<div class="table-wrap"><table class="schema-fields"><thead><tr><th>字段 / 中文名</th><th>类型</th><th>约束</th><th>默认值</th><th>字段作用与关联</th></tr></thead><tbody>${t.fields.map(f=>{let rel=[...(f.physicalRelations||[]),...(f.logicalRelations||[])].filter(r=>r.toTable&&r.toField).map(r=>`${r.kind==='physical'?'物理外键':'逻辑关联'}：${r.toTable}.${r.toField}${r.description?'（'+r.description+'）':''}`).join('；');return `<tr><td><code>${esc(f.name)}</code><br><b>${esc(f.label)}</b></td><td><code>${esc(f.type||'—')}</code></td><td><div class="schema-tags">${(f.tags||[]).map(schemaTag).join('')||'<span class="schema-tag">可空</span>'}</div></td><td><code>${esc(f.default??'—')}</code></td><td>${esc(f.description)}${rel?`<br><span class="schema-code">${esc(rel)}</span>`:''}</td></tr>`}).join('')}</tbody></table></div>`;let idx=t.indexes?.length?`<div class="schema-section-title"><h3>索引</h3></div><div class="schema-relations">${t.indexes.map(i=>`<div class="schema-relation"><code>${esc(i.name)}</code> ${i.unique?schemaTag('UNIQUE'):''}<p>${esc((i.fields||[]).join(', ')||'表达式或自动索引')}</p></div>`).join('')}</div>`:'';return `<details class="schema-table" ${S.cache.schemaQuery?'open':''}><summary><div class="schema-title"><b>${esc(t.label)}</b><code>${esc(t.name)}</code></div><div class="schema-purpose">${esc(t.purpose)}</div><span class="badge">${t.fieldCount} 字段</span><span class="badge">${esc(t.scopeType||'结构元数据')}</span></summary><div class="schema-body">${fields}${idx}</div></details>`}

async function members(id,name){

 const items=d.items||[];
 const html=`<div class="member-add-panel">

  </div>
 </div>`+table([
  ['姓名',x=>esc(x.display_name||x.login_name||'—')],['登录名',x=>esc(x.login_name||'—')],
  ['部门',x=>esc(x.department_name||'—')],['职位',x=>esc(x.position_name||'—')],['角色',x=>esc(x.role_names||'—')],
  ['成员类型',x=>esc(TEAM_MEMBER_TYPES[x.membership_type]||x.membership_type||'—')],
  ['主团队','is_primary',x=>x.is_primary?'是':'否'],['状态','user_status',x=>status(x.user_status||x.status)]
 ],items,x=>`<button type="button" class="btn secondary small" data-member-edit data-user-id="${esc(x.user_id)}">编辑关系</button> ${x.is_primary?'':`<button type="button" class="btn secondary small" data-member-primary data-user-id="${esc(x.user_id)}">设为主团队</button> <button type="button" class="btn danger small" data-member-remove data-user-id="${esc(x.user_id)}">移出</button>`}`);
 openReadonlyModal(`团队成员 — ${name}（${items.length}）`,html,{
  onOpened:body=>{
   document.querySelector('#modal .modal')?.classList.add('team-members-modal');
   const search=body.querySelector('#memberSearch'),select=body.querySelector('#memberUser'),hint=body.querySelector('#memberSearchHint');
   let timer=0,serial=0;
   const runSearch=async()=>{
    const term=search.value.trim(),seq=++serial;
    if(!term){select.innerHTML='<option value="">请先输入搜索关键词</option>';hint.textContent='输入关键词从服务器搜索，最多显示 50 条';return}

     select.innerHTML='<option value="">选择用户</option>'+rows.map(x=>`<option value="${esc(x.user_id)}">${esc(x.display_name||x.login_name)}（${esc(x.login_name)}） · ${esc(x.department_name||'未分部门')} · ${esc(x.position_name||'未设职位')}</option>`).join('');

   };

   });

 });

async function addTeamMember(tid,name){

// 把毫秒时间戳转换为 <input type="datetime-local"> 需要的本地时间字符串
function _tsToLocalInput(ts){
 if(ts===undefined||ts===null||ts==='')return '';
 let n=Number(ts);
 if(!Number.isFinite(n)||n<=0)return '';
 if(n<1e12)n*=1000; // 兼容历史秒级数据
 const d=new Date(n);
 if(Number.isNaN(d.getTime()))return '';
 const pad=x=>String(x).padStart(2,'0');
 return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
// 解析 datetime-local 字符串为毫秒时间戳；空值返回 null
function _localInputToTs(v){
 if(v===undefined||v===null||v==='')return null;
 const d=new Date(v);
 const n=d.getTime();
 return Number.isNaN(n)?null:n;
}
// 把毫秒时间戳转换为 <input type="date"> 需要的 YYYY-MM-DD 字符串
function _tsToLocalDate(ts){
 if(ts===undefined||ts===null||ts==='')return '';
 let n=Number(ts);
 if(!Number.isFinite(n)||n<=0)return '';
 if(n<1e12)n*=1000;
 const d=new Date(n);
 if(Number.isNaN(d.getTime()))return '';
 const pad=x=>String(x).padStart(2,'0');
 return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
// 自定义日历选择器（不依赖浏览器原生 picker，所有浏览器一致体验）
function openCalendar(trigger,hidden){
 const existing=document.getElementById('calendarPopup');
 if(existing){existing.remove();document.removeEventListener('mousedown',_calOutside,true);document.removeEventListener('keydown',_calEsc,true)}
 const pad=x=>String(x).padStart(2,'0');
 const parse=v=>{const m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return null;return new Date(Number(m[1]),Number(m[2])-1,Number(m[3]))};
 const today=new Date();today.setHours(0,0,0,0);
 let cur=parse(hidden.value)||new Date(today);
 const sel=parse(hidden.value);
 const popup=document.createElement('div');
 popup.id='calendarPopup';popup.className='calendar-popup';
 const render=()=>{
  const y=cur.getFullYear(),m=cur.getMonth();
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  const startDow=first.getDay(); // 0=Sun
  const prevLast=new Date(y,m,0).getDate();
  const cells=[];
  for(let i=startDow-1;i>=0;i--)cells.push({y:m===0?y-1:y,m:m===0?11:m-1,d:prevLast-i,muted:true});
  for(let d=1;d<=last.getDate();d++)cells.push({y,m,d,muted:false});
  while(cells.length%7!==0||cells.length<42){const n=cells.length-prevLast-(startDow-1);cells.push({y:m===11?y+1:y,m:m===11?0:m+1,d:n,muted:true})}
  popup.innerHTML=`
   <div class="cal-nav">
    <button type="button" data-cal-prev-year aria-label="上一年">«</button>
    <button type="button" data-cal-prev-month aria-label="上月">‹</button>
    <div class="cal-title">${y} 年 ${pad(m+1)} 月</div>
    <button type="button" data-cal-next-month aria-label="下月">›</button>
    <button type="button" data-cal-next-year aria-label="下一年">»</button>
   </div>
   <div class="cal-grid">
    ${['日','一','二','三','四','五','六'].map(x=>`<div class="cal-dow">${x}</div>`).join('')}
    ${cells.map(c=>{
     const dStr=`${c.y}-${pad(c.m+1)}-${pad(c.d)}`;
     const isToday=dStr===`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
     const isSel=sel&&dStr===`${sel.getFullYear()}-${pad(sel.getMonth()+1)}-${pad(sel.getDate())}`;
     return `<button type="button" class="cal-day${c.muted?' muted':''}${isToday?' today':''}${isSel?' selected':''}" data-d="${dStr}">${c.d}</button>`;
    }).join('')}
   </div>
   <div class="cal-foot">
    <button type="button" data-cal-today>今天</button>
    <button type="button" data-cal-clear>清除</button>
    <button type="button" class="primary" data-cal-close>关闭</button>
   </div>`;
 };
 render();
 // 计算弹层位置（紧贴触发按钮下方，溢出视口则翻转）
 const r=trigger.getBoundingClientRect();
 popup.style.left=(r.left+window.scrollX)+'px';
 popup.style.top=(r.bottom+window.scrollY+4)+'px';
 document.body.appendChild(popup);
 const overflow=popup.getBoundingClientRect();
 if(overflow.right>window.innerWidth-8){popup.style.left=(window.innerWidth-popup.offsetWidth-8+window.scrollX)+'px'}
 if(overflow.bottom>window.innerHeight-8){popup.style.top=(r.top+window.scrollY-popup.offsetHeight-4)+'px'}
 // 事件
 popup.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  e.preventDefault();e.stopPropagation();
  if(b.dataset.calPrevYear!==undefined)cur=new Date(cur.getFullYear()-1,cur.getMonth(),1);
  else if(b.dataset.calPrevMonth!==undefined)cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);
  else if(b.dataset.calNextMonth!==undefined)cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  else if(b.dataset.calNextYear!==undefined)cur=new Date(cur.getFullYear()+1,cur.getMonth(),1);
  else if(b.dataset.calToday!==undefined){const t=new Date();cur=new Date(t.getFullYear(),t.getMonth(),1);hidden.value=`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;hidden.dispatchEvent(new Event('change',{bubbles:true}));close()}
  else if(b.dataset.calClear!==undefined){hidden.value='';hidden.dispatchEvent(new Event('change',{bubbles:true}));close()}
  else if(b.dataset.calClose!==undefined){close();return}
  else if(b.dataset.d){hidden.value=b.dataset.d;hidden.dispatchEvent(new Event('change',{bubbles:true}));close();return}
  render();
 });
 function close(){popup.remove();document.removeEventListener('mousedown',_calOutside,true);document.removeEventListener('keydown',_calEsc,true)}
 function _calOutside(ev){if(!popup.contains(ev.target)&&ev.target!==trigger&&!trigger.contains(ev.target))close()}
 function _calEsc(ev){if(ev.key==='Escape')close()}
 setTimeout(()=>{document.addEventListener('mousedown',_calOutside,true);document.addEventListener('keydown',_calEsc,true)},0);
}

function _campaignPayload(o,isUpdate){
 const base={
  name:String(o.name||'').trim(),
  code:String(o.code||'').trim()||undefined,
  workspaceId:String(o.workspaceId||'').trim(),
  type:o.campaign_type||'marketing',
  status:o.status||'draft',
  platformId:o.platformId||undefined,
  channelAccountId:o.channelAccountId||undefined,
  businessLineId:o.businessLineId||undefined,
  marketId:o.marketId||undefined,
  startAt:_localInputToTs(o.start_at),
  endAt:_localInputToTs(o.end_at)
 };
 if(!isUpdate)delete base.code;
 if(isUpdate){
  base.code=String(o.code||'').trim()||undefined;
  base.reason=String(o.reason||'').trim();
 }
 // 清理 undefined
 Object.keys(base).forEach(k=>{if(base[k]===undefined)delete base[k]});
 return base;
}
async function createCampaign(){

  const deps=await _loadCampaignDeps();
  if(!deps.workspaces.length){toast('当前企业暂无工作区，请先创建工作区',1);return}
  openFormModal('新建营销活动',_buildCampaignFields({},deps),async (_,form)=>{
   const o=modalFormValues(form,_buildCampaignFields({},deps));
   const body=_campaignPayload(o,false);
   if(!body.name){toast('请填写活动名称',1);return false}
   if(!body.workspaceId){toast('请选择所属工作区',1);return false}
   if(body.startAt&&body.endAt&&body.endAt<body.startAt){toast('结束时间不能早于开始时间',1);return false}
   try{
    await api('/api/v207/admin/campaigns'+qp(),{method:'POST',body});
    toast('活动创建成功');
    closeModal();await loadPage();
   }catch(err){toast(err.message||'创建失败',1)}
   return false;
  },{html:_buildCampaignFields({},deps).map(modalFieldHtml).join(''),submitText:'创建活动',reload:false,
   onOpened:(body,form)=>{
    // 平台 ↔ 渠道账号联动：选择平台后，自动筛选账号选项；如已选账号同步反填平台
    const pidSel=body.querySelector('select[name=platformId]');
    const accSel=body.querySelector('select[name=channelAccountId]');
    if(pidSel&&accSel){
     const allAccounts=deps.accounts.map(a=>({value:a.channel_account_id,label:`${a.display_name||a.channel_account_id} · ${a.platform_name||a.platform_code||'未分类'}${a.status==='active'?'':'（已停用）'}`}));
     const refreshAcc=()=>{
      const pid=pidSel.value;
      const prev=accSel.value;
      const list=pid?allAccounts.filter(a=>{const item=deps.accounts.find(x=>x.channel_account_id===a.value);return item&&item.platform_id===pid}):[{value:'',label:'不绑定账号'},...allAccounts];
      accSel.innerHTML=list.map(x=>`<option value="${esc(x.value)}">${esc(x.label)}</option>`).join('');
      accSel.value=list.some(x=>x.value===prev)?prev:'';
     };
     pidSel.addEventListener('change',refreshAcc);
     accSel.addEventListener('change',()=>{
      if(!accSel.value)return;
      const acc=deps.accounts.find(a=>a.channel_account_id===accSel.value);
      if(acc&&acc.platform_id&&pidSel.value!==acc.platform_id){pidSel.value=acc.platform_id;refreshAcc()}
     });
    }
   }});
 }catch(e){toast(e.message||'活动表单加载失败',1)}
}

function computeDepth(items,parentKey='parent_id'){
 let map={};items.forEach(r=>{map[r[parentKey]||null]=(map[r[parentKey]||null]||0)+1});
 let depthMap={};
 function depth(id){
  if(depthMap[id]!==undefined)return depthMap[id];
  let node=items.find(r=>r.department_id===id||r.business_line_id===id||r.market_id===id);
  if(!node||!node[parentKey])return 0;
  return depthMap[id]=(depth(node[parentKey])+1);
 }
 return items.map(r=>depth(r.department_id||r.business_line_id||r.market_id));
}

function buildTree(items,idKey,parentKey,nameKey){
  const map={},roots=[];
  (items||[]).forEach(it=>{map[it[idKey]]={name:it[nameKey]||it.name||'(未命名)',children:[],raw:it};});
  (items||[]).forEach(it=>{
    const node=map[it[idKey]],p=it[parentKey];
    if(p&&map[p])map[p].children.push(node);else roots.push(node);
  });
  const prune=n=>{if(!n.children.length)delete n.children;else n.children.forEach(prune);};
  roots.forEach(prune);
  return roots.length===1?roots[0]:(roots.length?{name:'全部',children:roots}:{name:'（暂无数据）'});
}

function ccDetailValue(def,prefix='ccf_'){

function ccQueueDetailAutoSave(section){const st=ccState(),r=st.detail;if(!r)return;let body={baseVersion:r.version,reason:'客户档案自动保存'};

 const input=$('#ccManualMergeQuery'),results=$('#ccManualMergeResults'),run=async()=>{const query=input.value.trim();if(query.replace(/[%_]/g,'').trim().length<2)return toast('请至少输入 2 个有效字符',1);results.innerHTML='<div class="cc-loading">正在搜索可管理的联系人…</div>';try{const out=await api(ccPath('/contact-search'),{method:'POST',body:{query,excludeContactId:r.contactId}}),items=out.items||[];results.innerHTML=items.map(x=>`<article class="cc-search-result"><div class="cc-search-avatar">${esc(String(x.displayName||'?').slice(0,1).toUpperCase())}</div><div class="grow"><b>${esc(x.displayName||x.contactId)}</b><div class="cc-sub">${esc(x.maskedPhone||'未显示电话')} · ${esc(x.contactId)}</div></div><button type="button" class="btn secondary small" data-merge-source="${esc(x.contactId)}">选择并预览</button></article>`).join('')||'<div class="cc-empty">未找到可管理的来源客户</div>';results.querySelectorAll('[data-merge-source]').forEach(btn=>btn.onclick=()=>{const source=btn.dataset.mergeSource;closeModal();setTimeout(()=>ccMergePreview(source),0)})}catch(e){results.innerHTML=`<div class="cc-error">${esc(e.message||'搜索失败')}</div>`}};

function ccMergeStepHtml(step,out,state){
 const basic=out.basicConflicts||out.conflicts||[],fields=out.fieldConflicts||out.customFieldConflicts||[],impact=out.impact||{};
 if(step===1)return `<div class="cc-section"><h4>1. 确认主客户与来源客户</h4><p>主客户：<b>${esc(out.target?.name||out.target?.contactId)}</b></p><p>来源客户：<b>${esc(out.source?.name||out.source?.contactId)}</b></p><div class="cc-error">合并后来源客户将被软删除，操作不可自动撤销。</div></div>`;
 if(step===2)return `<div class="cc-section"><h4>2. 处理基本资料冲突</h4>${basic.map((x,i)=>`<label>${esc(x.field)}：${esc(String(x.targetValue??''))} ↔ ${esc(String(x.sourceValue??''))}<select data-basic="${esc(x.field)}"><option value="target">保留主客户</option><option value="source">采用来源客户</option>${x.field==='remark'?'<option value="combine">合并备注</option>':''}</select></label>`).join('')||'<div class="cc-empty">无基本资料冲突</div>'}</div>`;
 if(step===3)return `<div class="cc-section"><h4>3. 处理动态字段冲突</h4>${fields.map(x=>`<label>${esc(x.fieldKey)}：${esc(JSON.stringify(x.targetValue))} ↔ ${esc(JSON.stringify(x.sourceValue))}<select data-field="${esc(x.fieldKey)}"><option value="target">保留主客户</option><option value="source">采用来源客户</option></select></label>`).join('')||'<div class="cc-empty">无动态字段冲突</div>'}</div>`;
 if(step===4)return `<div class="cc-section"><h4>4. 确认引用迁移影响</h4><div class="cc-timeline">${Object.entries(impact).map(([k,v])=>`<div class="cc-event"><b>${esc(k)}</b>：主客户 ${esc(v.target||0)}，来源客户 ${esc(v.source||0)}</div>`).join('')||'<div class="cc-empty">无引用影响</div>'}</div></div>`;
 return `<div class="cc-section"><h4>5. 审计原因与最终确认</h4><label>合并原因<textarea id="ccMergeReason" placeholder="必填：说明合并依据与业务原因"></textarea></label><label class="cc-check"><input id="ccMergeConfirm" type="checkbox"> 我已核对冲突策略和迁移影响，确认执行不可逆合并</label></div>`
}
async function ccMergePreview(sourceId){
 const r=ccState().detail;if(!r)return;
 try{
  const out=await api(ccPath('/merge-preview'),{method:'POST',authRedirect:false,body:{targetContactId:r.contactId,sourceContactId:sourceId}}),state={step:1,basic:{},fields:{},submitting:false};
  resetModal('wizard');
  $('#modalTitle').textContent='客户合并向导';
  const body=$('#modalBody'),form=$('#modalForm'),actions=form.querySelector('.modal-actions');
  // 合并向导只保留一套底部操作按钮。
  actions.replaceChildren();actions.classList.add('hide');
  const capture=()=>{body.querySelectorAll('[data-basic]').forEach(x=>state.basic[x.dataset.basic]=x.value);body.querySelectorAll('[data-field]').forEach(x=>state.fields[x.dataset.field]=x.value)};
  const render=()=>{
   body.innerHTML=`<div class="cc-merge-progress"><div><b>步骤 ${state.step} / 5</b><span>${['确认客户','基本资料','动态字段','影响范围','最终确认'][state.step-1]}</span></div><progress max="5" value="${state.step}"></progress></div>${ccMergeStepHtml(state.step,out,state)}<div id="ccMergeFeedback" class="sub" role="status" aria-live="polite"></div><div class="cc-savebar"><button type="button" class="btn secondary" id="ccMergeCancel">取消</button><span class="grow"></span><button type="button" class="btn secondary" id="ccMergeBack" ${state.step===1||state.submitting?'disabled':''}>上一步</button><button type="submit" class="btn" id="ccMergeNext" ${state.submitting?'disabled':''}>${state.submitting?'正在提交…':(state.step===5?(out.canMerge?'执行合并':'提交合并申请'):'下一步')}</button></div>`;
   $('#ccMergeCancel').onclick=()=>{if(!state.submitting)closeModal()};
   $('#ccMergeBack').onclick=()=>{if(state.submitting)return;capture();state.step=Math.max(1,state.step-1);render()};
  };
  const advance=async()=>{
   if(state.submitting)return;
   capture();
   if(state.step<5){state.step++;render();return}
   const reason=String($('#ccMergeReason')?.value||'').trim();
   if(!reason){$('#ccMergeFeedback').textContent='请输入合并原因';$('#ccMergeReason')?.focus();return}
   if(!$('#ccMergeConfirm')?.checked){$('#ccMergeFeedback').textContent='请勾选最终确认';$('#ccMergeConfirm')?.focus();return}
   state.submitting=true;render();
   try{
    if(out.canMerge){
     const result=await api(ccPath('/contacts/'+encodeURIComponent(r.contactId)+'/merge'),{method:'POST',body:{sourceContactId:sourceId,baseTargetVersion:out.target?.version??r.version,baseSourceVersion:out.source?.version,reason,basicResolution:state.basic,fieldResolution:state.fields}});
     if(result.merged!==true||!result.mergeId)throw Object.assign(Error('服务端未返回可验证的合并成功凭据'),{code:'MERGE_RESULT_UNVERIFIED',data:result});
     closeModal();ccShowMergeOutcome(true,'客户合并成功','两个客户已经完成原子合并',{合并编号:result.mergeId,主客户:result.targetContactId,来源客户:result.sourceContactId});toast('客户合并成功');toast('客户合并成功');try{await ccLoadList();await ccReloadDetail()}catch(refreshError){console.warn('merge committed but UI refresh failed',refreshError);toast('合并已成功，但页面刷新失败，请手动刷新',1)}ccSelectDetailTab('access');
    }else{
     const result=await api(ccPath('/merge-requests'),{method:'POST',authRedirect:false,body:{targetContactId:r.contactId,sourceContactId:sourceId,reason,suggestedResolution:{basicResolution:state.basic,fieldResolution:state.fields}}});
     if(!result.requestId||result.requestStatus!=='pending')throw Object.assign(Error('服务端未确认申请进入待审批状态'),{code:'MERGE_REQUEST_UNVERIFIED',data:result});
     closeModal();ccShowMergeOutcome(true,result.deduplicated?'合并申请已存在':'合并申请提交成功',result.deduplicated?'相同申请此前已经提交，无需重复提交':'申请已经持久化并进入待审批队列',{申请编号:result.requestId,申请状态:'待审批'});
    }
   }catch(e){
    const msg=e.code==='MERGE_REFERENCE_TABLE_UNSUPPORTED'?'存在尚未支持迁移的客户引用表，已安全阻断合并':e.code==='MERGE_REVIEW_REQUIRED_AGAIN'?'客户资料已变化，请重新发起合并向导并核对最新冲突策略':(e.message||'提交失败');
    closeModal();ccShowMergeOutcome(false,out.canMerge?'客户合并失败':'合并申请提交失败',msg,{错误代码:e.code||'UNKNOWN_ERROR',HTTP状态:e.status||'',申请状态:e.data?.requestStatus||''});
   }
  };
  form.onsubmit=e=>{e.preventDefault();advance()};
  $('#modal').classList.remove('hide');ccIdentityModalContext('merge-wizard','五步核对向导；');render();
 }catch(e){toast(e.message||'合并预览失败',1)}
}

async function ccOpenMergeApprovalCenter(){
 if(!ccCan('contact.merge.review')){ccShowMergeOutcome(false,'无法打开合并审批','当前账号没有合并审批权限',{错误代码:'FORBIDDEN'});return}
 try{
  const o=await api(ccPath('/merge-requests',{status:'actionable'}));const items=o.items||[];ccApplyMergeApprovalCount(items.length,false);
  const html=items.map(r=>{const failed=r.status==='failed',executing=r.status==='executing';const state=failed?'上次执行失败，可重试':(executing?'执行状态异常，可恢复':'待审批');return `<div class="panel"><b>${esc(r.source_display_name)} → ${esc(r.target_display_name)}</b><p><b>状态：</b>${esc(state)}　<b>申请编号：</b><code>${esc(r.request_id)}</code></p><p>申请人：${esc(r.requester_name||r.requested_by)}；原因：${esc(r.reason)}</p><p>负责人：${esc(r.source_owner_name||'未分配')} → ${esc(r.target_owner_name||'未分配')}；团队：${esc(r.source_team_name||'未分配')} → ${esc(r.target_team_name||'未分配')}</p>${o.canReview?`<button class="btn small" onclick="ccReviewMergeRequest('${esc(r.request_id)}','approve')">${failed||executing?'重试并验证合并':'批准并原子合并'}</button> <button class="btn danger small" onclick="ccReviewMergeRequest('${esc(r.request_id)}','reject')">拒绝</button>`:''}</div>`}).join('')||'<div class="empty">暂无可处理的合并申请</div>';
  openReadonlyModal('客户合并审批'+(items.length?`（${items.length}）`:''),html)
 }catch(e){ccShowMergeOutcome(false,'审批列表加载失败',e.message||'无法加载审批列表',{错误代码:e.code||'UNKNOWN_ERROR',HTTP状态:e.status||''})}
}
async function ccReviewMergeRequest(id,action){
 const comment=prompt(action==='approve'?'请输入批准意见（批准后将立即执行并验证合并）':'请输入拒绝原因');
 if(!comment){ccShowMergeOutcome(false,'审批未提交','审批意见不能为空，本次操作未执行',{申请编号:id});return}
 try{
  const result=await api(ccPath('/merge-requests/'+encodeURIComponent(id)+'/review'),{method:'POST',authRedirect:false,body:{action,comment},timeout:60000});
  if(action==='approve'){
   if(result.requestStatus!=='merged'||result.merged!==true||!result.mergeId)throw Object.assign(Error('服务端没有返回已落库的合并凭据'),{code:'MERGE_RESULT_UNVERIFIED',data:result});
   closeModal();ccShowMergeOutcome(true,'审批及客户合并成功','审批已通过，客户数据已经完成原子合并',{申请编号:id,合并编号:result.mergeId,主客户:result.targetContactId,来源客户:result.sourceContactId});
  }else{
   if(result.requestStatus!=='rejected')throw Object.assign(Error('服务端没有确认拒绝状态'),{code:'REVIEW_RESULT_UNVERIFIED',data:result});
   closeModal();ccShowMergeOutcome(true,'合并申请已拒绝','拒绝结果已经保存',{申请编号:id,申请状态:'已拒绝'});
  }
  ccPollMergeApprovals(false)
 }catch(e){
 const host=document.querySelector('#modalBody')||document.querySelector('#modal .modal');
 let box=document.getElementById('ccMergeApprovalError');
 if(host&&!box){box=document.createElement('div');box.id='ccMergeApprovalError';box.className='panel';box.setAttribute('role','alert');box.style.cssText='margin:0 0 12px;border-color:var(--bad);color:var(--bad)';host.prepend(box)}
 const title=action==='approve'?'合并审批失败':'拒绝申请失败';
 if(box)box.innerHTML='<b>'+esc(title)+'</b><br>'+esc(e.message||'处理失败')+'<br><code>'+esc(e.code||'UNKNOWN_ERROR')+(e.status?' · HTTP '+esc(String(e.status)):'')+'</code><p class="sub">审批窗口已保留，请核对冲突后重试。</p>';
 else toast(e.message||'处理失败',1);
 return false;
}
}

let ccApprovalPollBusy=false;
function ccPlaceMergeApprovalEntry(){
 const btn=document.querySelector('#ccMergeApprovalEntry');if(!btn||PORTAL!=='business')return;
 const group=document.querySelector('#mainNav details[data-group="business-customers"] .nav-items');if(!group)return;
 if(btn.parentElement!==group)group.appendChild(btn);
 btn.hidden=!ccCan('contact.merge.review');
}
function ccApplyMergeApprovalCount(count,notify=true){
 const btn=document.querySelector('#ccMergeApprovalEntry'),badge=btn?.querySelector('.cc-approval-badge');if(!btn||!badge)return;
 const n=Math.max(0,Number(count)||0);badge.textContent=n>99?'99+':String(n);badge.hidden=n===0;btn.classList.toggle('cc-has-pending',n>0);btn.title=n?`有 ${n} 个客户合并申请待审批`:'暂无待审批的客户合并申请';
 if(notify&&n>0){const key=`cc-merge-approval-notified:${S.profile?.organizationId||S.profile?.organization_id||''}:${S.profile?.userId||S.profile?.user_id||''}:${n}`;if(!sessionStorage.getItem(key)){sessionStorage.setItem(key,'1');toast(`有 ${n} 个客户合并申请待审批，请在“客户与沟通 → 合并审批”中处理`,1)}}
}
async function ccPollMergeApprovals(notify=true){
 ccPlaceMergeApprovalEntry();if(PORTAL!=='business'||!ccCan('contact.merge.review')||ccApprovalPollBusy)return;ccApprovalPollBusy=true;
 try{const o=await api(ccPath('/merge-requests',{status:'actionable'}));ccApplyMergeApprovalCount((o.items||[]).length,notify)}catch(e){console.warn('merge approval notification poll failed',e)}finally{ccApprovalPollBusy=false}
}
setTimeout(()=>ccPollMergeApprovals(true),1200);
setInterval(()=>ccPollMergeApprovals(true),30000);
new MutationObserver(()=>ccPlaceMergeApprovalEntry()).observe(document.querySelector('#mainNav')||document.body,{childList:true,subtree:true});
</script></body></html>
