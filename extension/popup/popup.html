<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head><body><h3>JubaOpen Collector 210.2.75</h3><p><small id="notificationState">正在检查后台通知状态…</small></p>
<div id="connectBox"><label>服务器地址<input id="server" placeholder="https://crm.example.com"></label><label>一次性接入码<input id="code" autocomplete="one-time-code" placeholder="XXXX-XXXX-XXXX-XXXX"></label><label>插件实例名称（可选）<input id="alias" placeholder="Chrome Profile 1"></label><label>计算机别名（可选）<input id="computer" placeholder="业务员电脑 A"></label><button id="connect">接入新设备</button><hr><label>设备换绑码<input id="rebindCode" autocomplete="one-time-code" placeholder="XXXX-XXXX-XXXX-XXXX"></label><button id="rebind">换绑原设备用户</button><small>换绑会保留当前安装实例和原设备档案，待上传消息不会被删除。</small></div>
<div id="context" hidden><div class="ok">设备已接入</div><dl><dt>用户</dt><dd id="user">—</dd><dt>团队</dt><dd id="team">—</dd><dt>工作区</dt><dd id="workspace">—</dd><dt>有效期</dt><dd id="expires">—</dd></dl><button id="showRebind">更换绑定用户</button><button id="logout" class="danger">退出并撤销当前会话</button></div><p id="status"></p><script src="popup.js"></script></body></html>
