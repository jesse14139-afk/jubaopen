<!doctype html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聚宝盆 V207 企业管理中心</title>
<style>
:root{--pink:#ec4899;--pink2:#be185d;--bg:#090b16;--side:#111222;--panel:#171827;--panel2:#202235;--text:#f6f0f5;--muted:#aaa5b0;--line:#343447;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--blue:#60a5fa;--shadow:0 14px 40px #0005}html[data-theme=light]{--bg:#fff7fb;--side:#fff;--panel:#fff;--panel2:#fce7f3;--text:#3f2637;--muted:#806b78;--line:#f2cddd;--shadow:0 14px 40px #9d174d18}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,"Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#be185d44,transparent 35%),var(--bg)}.login-card{width:min(430px,92vw);padding:34px;border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:var(--shadow)}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:white;font-weight:900;background:linear-gradient(135deg,var(--pink),#8b5cf6)}h1,h2,h3,p{margin:0}.sub{color:var(--muted);margin:8px 0 24px}.field{display:grid;gap:7px;margin:13px 0}.field input,.field select,.field textarea,.select{width:100%;padding:11px 12px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px}.btn{padding:10px 14px;border-radius:10px;color:white;background:linear-gradient(135deg,var(--pink),var(--pink2));font-weight:650}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:#be123c}.btn.small{padding:6px 9px;font-size:12px}.login .btn{width:100%;margin-top:8px}.error{color:var(--bad);min-height:20px}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.sidebar{position:fixed;inset:0 auto 0 0;width:240px;padding:18px 12px;background:var(--side);border-right:1px solid var(--line);overflow:auto}.sidebar .brand{padding:4px 8px 19px}.nav-title{padding:14px 10px 5px;color:var(--muted);font-size:11px}.nav button{width:100%;text-align:left;padding:10px 12px;margin:2px 0;border-radius:10px;color:var(--muted);background:transparent}.nav button:hover,.nav button.active{color:white;background:linear-gradient(90deg,var(--pink2),#7c3aed)}.main{grid-column:2;min-width:0}.top{height:70px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 24px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.top .select{width:230px}.grow{flex:1}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--pink2);color:white}.content{padding:24px}.pagehead{display:flex;align-items:center;gap:12px;margin-bottom:18px}.pagehead p{color:var(--muted);margin-top:5px}.cards{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:13px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 20px #0001}.card{padding:17px}.card b{display:block;font-size:26px;margin-top:10px}.card span{color:var(--muted)}.panel{padding:18px;margin-top:15px}.panel-head,.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:13px}.panel-head .grow{color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.bar{height:10px;background:var(--panel2);border-radius:9px;overflow:hidden;margin:7px 0 12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),#8b5cf6)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);max-width:320px;overflow:hidden;text-overflow:ellipsis}th{font-size:12px;color:var(--muted);background:var(--panel2);position:sticky;top:0}tr:hover td{background:#ec489908}.status{display:inline-flex;padding:3px 8px;border-radius:20px;font-size:12px;background:#64748b22}.status.active{color:var(--ok);background:#10b98118}.status.disabled{color:var(--bad);background:#fb718518}.empty{text-align:center;padding:40px;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;z-index:30;padding:13px 18px;border-radius:12px;background:#18181b;color:white;box-shadow:var(--shadow);max-width:420px}.modal-bg{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#0009;padding:20px}.modal{width:min(580px,96vw);max-height:90vh;overflow:auto;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.modal-head{display:flex;align-items:center;margin-bottom:15px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.json{white-space:pre-wrap;word-break:break-all;font:12px ui-monospace,monospace;color:var(--muted);max-height:360px;overflow:auto}.graphbox{height:650px;overflow:hidden;background:var(--bg);border:1px solid var(--line);border-radius:14px}.graphbox svg{width:100%;height:100%}.edge{stroke:var(--line);stroke-width:1.3}.gnode rect{fill:var(--panel2);stroke:var(--pink);rx:9}.gnode text{fill:var(--text);font-size:11px}.badge{padding:4px 8px;border-radius:20px;background:var(--panel2);color:var(--muted)}.mobile{display:none}.kv{display:grid;grid-template-columns:170px 1fr;gap:9px;padding:8px;border-bottom:1px solid var(--line)}
.schema-hero{padding:22px;background:linear-gradient(135deg,#ec489918,#8b5cf612),var(--panel);border:1px solid var(--line);border-radius:18px}.schema-note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;margin-top:12px;border:1px solid #fbbf2444;border-radius:12px;background:#fbbf240c;color:var(--muted)}.schema-cats{display:grid;grid-template-columns:repeat(3,minmax(190px,1fr));gap:12px;margin-top:15px}.schema-cat{padding:15px;text-align:left;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:14px}.schema-cat:hover,.schema-cat.active{border-color:var(--pink);box-shadow:0 0 0 2px #ec489918}.schema-cat b{display:block;margin-bottom:6px}.schema-cat small{display:block;color:var(--muted);line-height:1.5}.schema-cat em{display:block;margin-top:10px;color:var(--pink);font-style:normal}.schema-tools{position:sticky;top:82px;z-index:4;display:flex;gap:10px;align-items:center;padding:12px;margin-top:15px;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px}.schema-tools input{flex:1}.schema-table{overflow:hidden;margin-top:13px;background:var(--panel);border:1px solid var(--line);border-radius:15px}.schema-table summary{display:flex;align-items:center;gap:12px;padding:16px;cursor:pointer;list-style:none}.schema-table summary::-webkit-details-marker{display:none}.schema-table summary:before{content:'›';font-size:24px;color:var(--pink);transition:.15s}.schema-table[open] summary:before{transform:rotate(90deg)}.schema-table summary:hover{background:#ec489908}.schema-title{min-width:230px}.schema-title b{display:block;font-size:15px}.schema-title code,.schema-code{color:var(--blue);font:12px ui-monospace,monospace}.schema-purpose{flex:1;color:var(--muted);line-height:1.5}.schema-body{padding:0 16px 16px}.schema-tags{display:flex;flex-wrap:wrap;gap:5px}.schema-tag{display:inline-flex;padding:3px 7px;border-radius:7px;background:#64748b20;color:var(--muted);font-size:11px}.schema-tag.pk{color:#f9a8d4;background:#ec489918}.schema-tag.fk{color:#93c5fd;background:#3b82f618}.schema-tag.sensitive{color:#fda4af;background:#fb718518}.schema-fields td{white-space:normal;vertical-align:top;line-height:1.5}.schema-fields td:first-child code{color:var(--blue)}.schema-relations{display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:10px}.schema-relation{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--bg)}.schema-relation code{color:var(--blue)}.schema-relation p{margin-top:7px;color:var(--muted)}.schema-section-title{display:flex;align-items:center;gap:8px;margin:18px 0 10px}.schema-alert{color:var(--warn)}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{transform:translateX(-100%);z-index:15;transition:.2s}.sidebar.open{transform:none}.main{grid-column:1}.mobile{display:block}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.schema-cats{grid-template-columns:repeat(2,1fr)}.schema-relations{grid-template-columns:1fr}.schema-tools{top:72px}.content{padding:16px}.top{padding:10px 14px}.top .select{width:150px}}@media(max-width:520px){.cards{grid-template-columns:1fr}.schema-cats{grid-template-columns:1fr}.schema-table summary{align-items:flex-start;flex-wrap:wrap}.schema-title{min-width:0;width:100%}.schema-tools{flex-wrap:wrap}.schema-tools input{flex-basis:100%}.usertext{display:none}}

.password-modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;background:#000b}.password-modal.hide{display:none!important}.password-card{width:min(460px,96vw);padding:26px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.password-card h2{font-size:21px}.password-card .sub{margin:7px 0 20px}.password-card .btn{width:100%;margin-top:8px}
</style></head><body>
<section id="login" class="login"><form class="login-card" id="loginForm"><div class="brand"><div class="logo">聚</div><div><h2>聚宝盆企业管理中心</h2><div class="sub">V207.2.0-dev · Schema 207</div></div></div><div class="field"><label>企业 ID</label><input id="loginOrg" value="org_default" autocomplete="organization"></div><div class="field"><label>登录名</label><input id="loginName" value="admin" autocomplete="username"></div><div class="field"><label>密码</label><input id="loginPass" type="password" autocomplete="current-password"></div><div id="loginError" class="error"></div><button class="btn" type="submit">安全登录</button><p class="sub" style="text-align:center">服务端 RBAC · 企业隔离 · 操作审计</p></form></section>
<section id="app" class="app hide"><aside class="sidebar" id="side"><div class="brand"><div class="logo">聚</div><div><b>聚宝盆</b><small style="display:block;color:var(--muted)">企业管理中心</small></div></div><nav class="nav"><div class="nav-title">总览</div><button data-page="dashboard">◈ 业务总览</button><button data-page="graph">⌘ 全景关系图</button><div class="nav-title">组织与权限</div><button data-page="organizations">▣ 企业管理</button><button data-page="teams">♚ 团队管理</button><button data-page="users">♙ 用户管理</button><button data-page="roles">⚿ 角色与权限</button><button data-page="workspaces">▤ 工作区</button><div class="nav-title">渠道中心</div><button data-page="platforms">◎ 平台</button><button data-page="accounts">◉ 渠道账号与授权</button><div class="nav-title">来源与营销</div><button data-page="sources">◆ 来源节点</button><button data-page="campaigns">◇ 营销活动</button><div class="nav-title">客户中心</div><button data-page="contacts">♧ 联系人</button><button data-page="contact-identities">♙ 外部身份</button><button data-page="config">⚙ 标签与字段</button><div class="nav-title">系统运维</div><button data-page="devices">▧ 设备管理</button><button data-page="audit">☷ 审计日志</button><button data-page="diagnostics">♡ 系统诊断</button><button data-page="database">▦ 数据库结构</button><button data-page="migrations">⇧ 迁移记录</button></nav></aside><main class="main"><header class="top"><button class="btn secondary mobile" id="menu">☰</button><select id="orgSelect" class="select"></select><span id="health" class="badge">检查服务…</span><span class="grow"></span><button class="btn secondary" id="theme">◐ 主题</button><div class="avatar" id="avatar">管</div><div class="usertext"><b id="who"></b><small id="scope" style="display:block;color:var(--muted)"></small></div><button class="btn secondary" id="logout">退出</button></header><div class="content" id="content"></div></main></section>

<div id="passwordModal" class="password-modal hide"><div class="password-card"><div class="brand"><div class="logo">聚</div><div><h2>首次登录，请修改密码</h2><div class="sub">为了保护企业数据，请先设置新的管理员密码</div></div></div><form id="passwordForm"><div class="field"><label>当前密码</label><input id="oldPassword" type="password" autocomplete="current-password" required></div><div class="field"><label>新密码</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" required></div><div class="field"><label>确认新密码</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required></div><div id="passwordError" class="error"></div><button class="btn" type="submit">保存新密码</button></form></div></div>
<div id="modal" class="modal-bg hide"><div class="modal"><div class="modal-head"><h3 id="modalTitle"></h3><span class="grow"></span><button class="btn secondary small" onclick="closeModal()">✕</button></div><form id="modalForm"><div id="modalBody"></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">取消</button><button class="btn" type="submit">确认保存</button></div></form></div></div><div id="toast" class="toast hide"></div>
<script>
const S={token:sessionStorage.getItem('v207_token')||'',profile:null,org:'',page:'dashboard',cache:{},loadVersion:0};
function staleContextError(){let e=Error('页面上下文已变化');e.code='STALE_CONTEXT';return e}const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
async function api(path,opt={}){let method=opt.method||'GET',requestVersion=S.loadVersion,guard=method==='GET'&&opt.contextGuard!==false,r=await fetch(path,{method,headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{})},body:opt.body?JSON.stringify(opt.body):undefined});let d=await r.json().catch(()=>({ok:false,message:'响应格式错误'}));if(r.status===401&&S.token){sessionStorage.removeItem('v207_token');location.reload()}if(guard&&requestVersion!==S.loadVersion)throw staleContextError();if(!r.ok||d.ok===false)throw Error(d.message||d.code||('HTTP '+r.status));return d}
function toast(x,bad=false){let e=$('#toast');e.textContent=x;e.style.border='1px solid '+(bad?'var(--bad)':'var(--ok)');e.classList.remove('hide');setTimeout(()=>e.classList.add('hide'),2800)}function fmt(t){return t?new Date(Number(t)).toLocaleString():'—'}function status(v){return `<span class="status ${esc(v)}">${v==='active'?'正常':v==='disabled'?'已停用':esc(v||'未知')}</span>`}function qp(){return '?organization_id='+encodeURIComponent(S.org)}
function head(title,desc,action=''){return `<div class="pagehead"><div><h2>${title}</h2><p>${desc}</p></div><span class="grow"></span>${action}</div>`}function table(cols,items,actions){if(!items?.length)return '<div class="panel empty">暂无数据</div>';return `<div class="table-wrap"><table><thead><tr>${cols.map(x=>`<th>${x[0]}</th>`).join('')} ${actions?'<th>操作</th>':''}<function passwordChangeRequired(x){const c=x?.credential||x?.user?.credential||{};return x?.mustChangePassword===true||x?.must_change_password===true||x?.forcePasswordChange===true||x?.passwordChangeRequired===true||x?.user?.mustChangePassword===true||x?.user?.must_change_password===true||c.must_change===true||c.must_change===1||c.mustChange===true}
function showPasswordModal(){$('#login').classList.add('hide');$('#app').classList.add('hide');$('#passwordError').textContent='';$('#passwordModal').classList.remove('hide');$('#oldPassword').focus()}
function hidePasswordModal(){$('#passwordModal').classList.add('hide')}
async function boot(){if(!S.token)return;try{const pd=await api('/api/v207/admin/profile');S.profile=pd;if(passwordChangeRequired(pd)){showPasswordModal();return}$('#who').textContent=pd.user.display_name;$('#avatar').textContent=pd.user.display_name.slice(0,1);$('#scope').textContent=pd.platformAdmin?'平台超级管理员':'企业成员';const od=await api('/api/v207/admin/organizations');S.cache.organizations=od.items||[];$('#orgSelect').innerHTML=S.cache.organizations.map(o=>`<option value="${esc(o.organization_id)}">${esc(o.name)} · ${esc(o.organization_id)}</option>`).join('');S.org=pd.user.organization_id;$('#orgSelect').value=S.org;$('#login').classList.add('hide');$('#app').classList.remove('hide');await api('/health');$('#health').textContent='● 服务正常';navigate('dashboard')}catch(e){console.error('boot failed:',e);if(e.message&&(e.message.includes('403')||e.message.includes('Forbidden')||e.message.includes('首次登录'))){showPasswordModal();$('#passwordError').textContent='请先完成首次登录密码修改';return}sessionStorage.removeItem('v207_token');S.token='';$('#loginError').textContent=e.message||'登录失败'}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';try{const d=await api('/api/v207/auth/login',{method:'POST',body:{organizationId:$('#loginOrg').value.trim(),loginName:$('#loginName').value.trim(),password:$('#loginPass').value}});if(!d.accessToken)throw Error('登录响应缺少访问令牌');S.token=d.accessToken;sessionStorage.setItem('v207_token',S.token);if(passwordChangeRequired(d)){showPasswordModal();return}await boot()}catch(x){$('#loginError').textContent=x.message||'登录失败'}};
$('#passwordForm').onsubmit=async e=>{e.preventDefault();const error=$('#passwordError'),oldPassword=$('#oldPassword').value,newPassword=$('#newPassword').value,confirmPassword=$('#confirmPassword').value;error.textContent='';if(newPassword!==confirmPassword){error.textContent='两次输入的新密码不一致';return}if(newPassword.length<12||!/[A-Za-z]/.test(newPassword)||!/[0-9]/.test(newPassword)){error.textContent='新密码至少 12 位，并且必须包含字母和数字';return}if(oldPassword===newPassword){error.textContent='新密码不能与当前密码相同';return}try{await api('/api/v207/admin/change-password',{method:'POST',body:{oldPassword,currentPassword:oldPassword,newPassword,confirmPassword}});hidePasswordModal();sessionStorage.removeItem('v207_token');S.token='';$('#passwordForm').reset();$('#login').classList.remove('hide');$('#app').classList.add('hide');$('#loginError').textContent='密码修改成功，请使用新密码重新登录'}catch(x){error.textContent=x.message||'密码修改失败'}};
admin/profile')).user;let pd=await api('/api/v207/admin/profile');S.profile=pd;$('#who').textContent=pd.user.display_name;$('#avatar').textContent=pd.user.display_name.slice(0,1);$('#scope').textContent=pd.platformAdmin?'平台超级管理员':'企业成员';let od=await api('/api/v207/admin/organizations');S.cache.organizations=od.items;$('#orgSelect').innerHTML=od.items.map(o=>`<option value="${esc(o.organization_id)}">${esc(o.name)} · ${esc(o.organization_id)}</option>`).join('');S.org=pd.user.organization_id;$('#orgSelect').value=S.org;$('#login').classList.add('hide');$('#app').classList.remove('hide');await api('/health');$('#health').textContent='● 服务正常';navigate('dashboard')}catch(e){sessionStorage.removeItem('v207_token');S.token='';$('#loginError').textContent=e.message}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';try{let d=await api('/api/v207/auth/login',{method:'POST',body:{organizationId:$('#loginOrg').value.trim(),loginName:$('#loginName').value.trim(),password:$('#loginPass').value}});S.token=d.accessToken;sessionStorage.setItem('v207_token',S.token);boot()}catch(x){$('#loginError').textContent=x.message}};
$('#logout').onclick=async()=>{try{await api('/api/v207/auth/logout',{method:'POST'})}catch{}sessionStorage.clear();location.reload()};$('#theme').onclick=()=>{let t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.v207_theme=t};document.documentElement.dataset.theme=localStorage.v207_theme||'dark';$('#menu').onclick=()=>$('#side').classList.toggle('open');$('#orgSelect').onchange=e=>{S.org=e.target.value;let organizations=S.cache.organizations;S.cache=organizations?{organizations}:{};navigate(S.page)};document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>navigate(x.dataset.page));
function navigate(p){S.page=p;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===p));$('#side').classList.remove('open');loadPage()}
async function loadPage(){let version=++S.loadVersion,page=S.page,org=S.org,c=$('#content');c.innerHTML='<div class="panel empty">正在安全加载…</div>';try{await pages[page]();if(version!==S.loadVersion||page!==S.page||org!==S.org)return}catch(e){if(e.code==='STALE_CONTEXT'||version!==S.loadVersion||page!==S.page||org!==S.org)return;c.innerHTML=head('加载失败','接口拒绝或数据异常')+`<div class="panel error">${esc(e.message)}</div>`}}
const editBtn=(kind,r,id,name)=>`<button class="btn secondary small" onclick='editResource(${JSON.stringify(kind)},${JSON.stringify(r)},${JSON.stringify(id)},${JSON.stringify(name)})'>编辑</button>`;

function schemaTag(x){let c=x==='PK'?'pk':x==='FK'?'fk':x==='敏感'?'sensitive':'';return `<span class="schema-tag ${c}">${esc(x)}</span>`}
function selectSchemaCategory(k){S.cache.schemaCategory=k;renderDatabase()}
function filterSchema(){S.cache.schemaQuery=($('#schemaQuery')?.value||'').trim().toLowerCase();renderDatabase(true)}
function resetSchemaFilter(){S.cache.schemaCategory='all';S.cache.schemaQuery='';renderDatabase()}
function renderDatabase(keepFocus=false){let d=S.cache.databaseSchema;if(!d)return;let q=S.cache.schemaQuery||'',cat=S.cache.schemaCategory||'all';let tables=d.tables.filter(t=>{if(cat!=='all'&&t.category!==cat)return false;if(!q)return true;let text=[t.name,t.label,t.purpose,...t.fields.flatMap(f=>[f.name,f.label,f.description,...f.tags])].join(' ').toLowerCase();return text.includes(q)});let sums=d.summary,issues=d.integrity.foreignKeyIssues||[];let cats=[{key:'all',label:'全部数据表',description:'展示运行数据库中的全部业务表',tableCount:sums.tableCount,fieldCount:sums.fieldCount},...d.categories];let cards=`<div class="cards"><div class="card"><span>Schema 版本</span><b>${esc(d.schemaVersion)}</b></div><div class="card"><span>业务表 / 字段</span><b>${sums.tableCount} / ${sums.fieldCount}</b></div><div class="card"><span>索引 / 物理外键</span><b>${sums.indexCount} / ${sums.physicalForeignKeyCount}</b></div><div class="card"><span>完整性检查</span><b style="color:${d.integrity.quickCheck==='ok'&&!issues.length?'var(--ok)':'var(--bad)'}">${esc(d.integrity.quickCheck)} · ${issues.length} 异常</b></div></div>`;let categoryHtml=`<div class="schema-cats">${cats.map(x=>`<button class="schema-cat ${cat===x.key?'active':''}" onclick="selectSchemaCategory('${esc(x.key)}')"><b>${esc(x.label)}</b><small>${esc(x.description)}</small><em>${x.tableCount} 张表 · ${x.fieldCount} 个字段</em></button>`).join('')}</div>`;let tools=`<div class="schema-tools"><input id="schemaQuery" class="select" value="${esc(q)}" placeholder="搜索表名、字段名或中文用途" oninput="filterSchema()"><span class="badge">当前 ${tables.length} 张表</span><button class="btn secondary small" onclick="resetSchemaFilter()">重置</button><button class="btn secondary small" onclick="loadPage()">刷新结构</button></div>`;let warning=!d.tables.some(t=>t.name==='custom_field_definitions'&&t.fields.some(f=>f.name==='options'))?'<div class="schema-note"><b class="schema-alert">结构提示</b><span><code>custom_field_definitions.options</code> 当前运行库不存在；如业务需要下拉或多选选项，应通过单独迁移补丁增加，不能由展示页面隐式修改。</span></div>':'';let list=tables.map(schemaTableHtml).join('')||'<div class="panel empty">没有符合条件的数据表或字段</div>';let relations=d.relations.filter(r=>cat==='all'||[r.fromTable,r.toTable].some(n=>d.tables.find(t=>t.name===n)?.category===cat));let relHtml=`<div class="panel"><div class="panel-head"><h3>实体关系目录</h3><span class="grow">物理外键由 SQLite 强制约束；逻辑关联由 API、RBAC 和组织隔离代码维护</span></div><div class="schema-relations">${relations.map(r=>`<div class="schema-relation"><div>${schemaTag(r.kind==='physical'?'FK':'逻辑关联')} <code>${esc(r.fromTable)}.${esc(r.fromField)}</code> → <code>${esc(r.toTable)}.${esc(r.toField)}</code></div><p>${esc(r.description)}</p></div>`).join('')||'<div class="empty">当前分类无关系说明</div>'}</div></div>`;$('#content').innerHTML=head('数据库结构中心','Schema 207 数据字典、字段释义、约束和实体关系 · 只读展示','<span class="status active">只读元数据</span>')+`<div class="schema-hero">${cards}${categoryHtml}${(d.notes||[]).map(n=>`<div class="schema-note"><b>说明</b><span>${esc(n)}</span></div>`).join('')}${warning}</div>${tools}<div class="schema-section-title"><h3>数据表与字段字典</h3><span class="badge">点击表卡片展开</span></div>${list}<div class="schema-section-title"><h3>关系与约束</h3><span class="badge">${relations.length} 条</span></div>${relHtml}`;if(keepFocus){let e=$('#schemaQuery');e?.focus();e?.setSelectionRange(q.length,q.length)}}
function schemaTableHtml(t){let fields=`<div class="table-wrap"><table class="schema-fields"><thead><tr><th>字段 / 中文名</th><th>类型</th><th>约束</th><th>默认值</th><th>字段作用与关联</th></tr></thead><tbody>${t.fields.map(f=>{let rel=[...(f.physicalRelations||[]),...(f.logicalRelations||[])].map(r=>`${r.kind==='physical'?'物理外键':'逻辑关联'}：${r.toTable}.${r.toField}`).join('；');return `<tr><td><code>${esc(f.name)}</code><br><b>${esc(f.label)}</b></td><td><code>${esc(f.type||'—')}</code></td><td><div class="schema-tags">${(f.tags||[]).map(schemaTag).join('')||'<span class="schema-tag">可空</span>'}</div></td><td><code>${esc(f.default??'—')}</code></td><td>${esc(f.description)}${rel?`<br><span class="schema-code">${esc(rel)}</span>`:''}</td></tr>`}).join('')}</tbody></table></div>`;let idx=t.indexes?.length?`<div class="schema-section-title"><h3>索引</h3></div><div class="schema-relations">${t.indexes.map(i=>`<div class="schema-relation"><code>${esc(i.name)}</code> ${i.unique?schemaTag('UNIQUE'):''}<p>${esc((i.fields||[]).join(', ')||'表达式或自动索引')}</p></div>`).join('')}</div>`:'';return `<details class="schema-table" ${S.cache.schemaQuery?'open':''}><summary><div class="schema-title"><b>${esc(t.label)}</b><code>${esc(t.name)}</code></div><div class="schema-purpose">${esc(t.purpose)}</div><span class="badge">${t.fieldCount} 字段</span><span class="badge">${t.recordCount} 记录</span></summary><div class="schema-body">${fields}${idx}</div></details>`}
function bars(a){if(!a?.length)return '<div class="empty">暂无数据</div>';let mx=Math.max(...a.map(x=>x.value),1);return a.map(x=>`<div><span>${esc(x.name||'未分类')} · ${x.value}</span><div class="bar"><i style="width:${x.value/mx*100}%"></i></div></div>`).join('')}
function createOrg(){openModal('新建企业',[{name:'name',label:'企业名称',required:true},{name:'organizationId',label:'企业 ID（可留空自动生成）'}],o=>api('/api/v207/admin/organizations',{method:'POST',body:o}))}function createTeam(){openModal('新建团队',[{name:'name',label:'团队名称',required:true},{name:'workspaceName',label:'工作区名称'}],o=>api('/api/v207/admin/teams'+qp(),{method:'POST',body:o}))}function createUser(){let teams=S.cache.teams||[];openModal('新建用户',[{name:'loginName',label:'登录名',required:true},{name:'displayName',label:'显示名'},{name:'password',label:'临时密码（至少 12 位）',type:'password',required:true},{name:'teamId',label:'所属团队',type:'select',options:teams.map(x=>({value:x.team_id,label:x.name}))},{name:'roleId',label:'角色',type:'select',options:[['role_orgadmin','企业管理员'],['role_teamlead','团队主管'],['role_operator','操作员'],['role_readonly','只读用户'],['role_auditor','审计员']].map(x=>({value:x[0],label:x[1]}))}],o=>api('/api/v207/admin/users'+qp(),{method:'POST',body:o}))}function createAccount(){openModal('绑定渠道账号',[{name:'displayName',label:'账号显示名'},{name:'channel',label:'渠道',type:'select',options:['whatsapp','instagram','facebook','messenger','telegram'].map(x=>({value:x,label:x}))},{name:'identity',label:'账号身份',required:true},{name:'identityType',label:'身份类型',value:'login'},{name:'teamId',label:'授权团队',type:'select',options:(S.cache.teams||[]).map(x=>({value:x.team_id,label:x.name}))}],o=>api('/api/v207/admin/accounts'+qp(),{method:'POST',body:o}))}
function resetPwd(id){openModal('重置临时密码',[{name:'password',label:'新临时密码（至少 12 位）',type:'password',required:true}],o=>api(`/api/v207/admin/users/${id}/reset-password${qp()}`,{method:'POST',body:o}))}async function members(id,name){let d=await api(`/api/v207/admin/teams/${id}/members${qp()}`);showJson({团队:name,成员:d.items})}function editContact(r){openModal('编辑联系人',[{name:'manualName',label:'人工姓名',value:r.manual_name},{name:'manualPhone',label:'人工电话',value:r.manual_phone},{name:'remark',label:'备注',type:'textarea',value:r.remark},{name:'status',label:'业务状态',value:r.status},{name:'reason',label:'操作原因'}],o=>api(`/api/v207/admin/contacts/${r.contact_id}${qp()}`,{method:'PATCH',body:o}))}function searchContacts(){let q=$('#cq').value;navigate('contacts');setTimeout(()=>{},0)}function showJson(x){$('#modalTitle').textContent='详细信息';$('#modalBody').innerHTML='<pre class="json">'+esc(JSON.stringify(x,null,2))+'</pre>';$('#modalForm .modal-actions').classList.add('hide');$('#modal').classList.remove('hide')}
function drawGraph(g){let ns=[],es=[],add=(id,label,type)=>{if(id&&!ns.some(x=>x.id===id))ns.push({id,label,type})};(g.organizations||[]).forEach(x=>add(x.organization_id,x.name,'企业'));(g.teams||[]).forEach(x=>{add(x.team_id,x.name,'团队');es.push([x.organization_id,x.team_id]);es.push([x.team_id,x.workspace_id])});(g.workspaces||[]).forEach(x=>add(x.workspace_id,x.name,'工作区'));(g.users||[]).forEach(x=>add(x.user_id,x.display_name,'用户'));(g.teamMemberships||[]).forEach(x=>es.push([x.team_id,x.user_id]));(g.accounts||[]).forEach(x=>add(x.channel_account_id,x.display_name,'账号'));(g.accountGrants||[]).forEach(x=>es.push([x.team_id,x.channel_account_id]));(g.sources||[]).forEach(x=>{add(x.source_id,x.source_name,'来源');es.push([x.channel_account_id||x.team_id,x.source_id])});(g.devices||[]).forEach(x=>{add(x.device_id,x.admin_device_name||x.user_device_alias||x.system_device_name||x.device_id,'设备');es.push([x.team_id,x.device_id])});let W=1100,H=Math.max(650,Math.ceil(ns.length/6)*130),pos={};ns.forEach((n,i)=>{let col=i%6,row=Math.floor(i/6);pos[n.id]=[95+col*180,75+row*130]});let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><g>${es.filter(e=>pos[e[0]]&&pos[e[1]]).map(e=>`<line class="edge" x1="${pos[e[0]][0]}" y1="${pos[e[0]][1]}" x2="${pos[e[1]][0]}" y2="${pos[e[1]][1]}"/>`).join('')}</g><g>${ns.map(n=>`<g class="gnode" transform="translate(${pos[n.id][0]-70},${pos[n.id][1]-25})"><rect width="140" height="50"/><text x="70" y="19" text-anchor="middle">${esc(n.type)}</text><text x="70" y="37" text-anchor="middle">${esc(n.label).slice(0,16)}</text><title>${esc(n.id)}</title></g>`).join('')}</g></svg>`;$('#graphbox').innerHTML=svg}
boot();
</script></body></html>
