.schema-hero{padding:22px;background:linear-gradient(135deg,#ec489918,#8b5cf612),var(--panel);border:1px solid var(--line);border-radius:18px}.schema-note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;margin-top:12px;border:1px solid #fbbf2444;border-radius:12px;background:#fbbf240c;color:var(--muted)}.schema-cats{display:grid;grid-template-columns:repeat(3,minmax(190px,1fr));gap:12px;margin-top:15px}.schema-cat{padding:15px;text-align:left;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:14px}.schema-cat:hover,.schema-cat.active{border-color:var(--pink);box-shadow:0 0 0 2px #ec489918}.schema-cat b{display:block;margin-bottom:6px}.schema-cat small{display:block;color:var(--muted);line-height:1.5}.schema-cat em{display:block;margin-top:10px;color:var(--pink);font-style:normal}.schema-tools{position:sticky;top:82px;z-index:4;display:flex;gap:10px;align-items:center;padding:12px;margin-top:15px;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px}.schema-tools input{flex:1}.schema-table{overflow:hidden;margin-top:13px;background:var(--panel);border:1px solid var(--line);border-radius:15px}.schema-table summary{display:flex;align-items:center;gap:12px;padding:16px;cursor:pointer;list-style:none}.schema-table summary::-webkit-details-marker{display:none}.schema-table summary:before{content:'›';font-size:24px;color:var(--pink);transition:.15s}.schema-table[open] summary:before{transform:rotate(90deg)}.schema-table summary:hover{background:#ec489908}.schema-title{min-width:230px}.schema-title b{display:block;font-size:15px}.schema-title code,.schema-code{color:var(--blue);font:12px ui-monospace,monospace}.schema-purpose{flex:1;color:var(--muted);line-height:1.5}.schema-body{padding:0 16px 16px}.schema-tags{display:flex;flex-wrap:wrap;gap:5px}.schema-tag{display:inline-flex;padding:3px 7px;border-radius:7px;background:#64748b20;color:var(--mu </head><body>
<section id="login" class="login"><form class="login-card" id="loginForm"><div class="brand"><div class="logo">聚</div><div><h2>聚宝盆企业管理中心</h2><div class="sub">V207.7.0-dev · Schema 210</div></div></div><div class="field"><label>企业 ID</label><input id="loginOrg" value="jubaopen" placeholder="请输入企业 ID" autocomplete="organization"></div><div class="field"><label>登录名</label><input id="loginName" value="admin" autocomplete="username"></div><div class="field"><label>密码</label><input id="loginPass" type="password" autocomplete="current-password"></div><div id="loginError" class="error"></div><button class="btn" type="submit">安全登录</button><p class="sub" style="text-align:center">服务端 RBAC · 企业隔离 · 操作审计</p></form></section>
<section id="app" class="app hide"><aside class="sidebar" id="side"><div class="brand"><div class="logo">聚</div><div><b>聚宝盆</b><small style="display:block;color:var(--muted)">企业管理中心</small></div></div><nav class="nav"><div class="nav-title">总览</div><button data-page="dashboard">◈ 业务总览</button><button data-page="graph">⌘ 全景关系图</button><div class="nav-title">组织与权限</div><button data-page="organizations">▣ 企业管理</button><button data-page="structure">▦ 组织架构</button><button data-page="positions">♜ 职位管理</button><button data-page="teams">♚ 团队管理</button><button data-page="users">♙ 用户管理</button><button data-page="roles">⚿ 角色与权限</button><button data-page="workspaces">▤ 工作区</button>
<button data-page="rbac-matrix">⊞ 权限矩阵</button><div class="nav-title">渠道中心</div><button data-page="platforms">◎ 平台</button><button data-page="accounts">◉ 渠道账号授权</button><div class="nav-title">来源与营销</div><button data-page="sources">◆ 来源节点</button><button data-page="campaigns">◇ 营销活动</button><button data-page="source-paths">⚙ 来源拓扑</button><button data-page="journey">⚡ 客户旅程</button><div class="nav-title">客户中心</div><button data-page="contacts">♧ 联系人</button><button data-page="contact-identities">♙ 外部身份</button><button data-page="touchpoints">⚡ 触点事件</button><button data-page="attributions">∑ 归因贡献</button><button data-page="recycle">♻ 回收站</button><button data-page="config">⚙ 标签与字段</button><div class="nav-title">系统运维</div><button data-page="devices">▧ 设备管理</button><button data-page="sessions">◐ 用户会话</button><button data-page="audit">☷ 审计日志</button><button data-page="diagnostics">♡ 系统诊断</button><button data-page="database">▦ 数据库结构</button><button data-page="migrations">⇧ 迁移记录</button></nav></aside><main class="main"><header class="top"><button class="btn secondary mobile" id="menu">☰</button><select id="orgSelect" class="select"></select><span id="health" class="badge">检查服务…</span><span class="grow"></span><button class="btn secondary" id="theme">◐ 主题</button><div class="avatar" id="avatar">管</div><div class="usertext"><b id="who"></b><small id="scope" style="display:block;color:var(--muted)"></small></div><button class="btn secondary" id="logout">退出</button></header><div class="content" id="content"></div></main></section>

<div id="passwordModal" class="password-modal hide"><div class="password-card"><div class="brand"><div class="logo">聚</div><div><h2>首次登录，请修改密码</h2><div class="sub">为了保护企业数据，请先设置新的管理员密码</div></div></div><form id="passwordForm"><div class="field"><label>当前密码</label><input id="oldPassword" type="password" autocomplete="current-password" required></div><div class="field"><label>新密码</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" required></div><div class="field"><label>确认新密码</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required></div><div id="passwordError" class="error"></div><button class="btn" type="submit">保存新密码</button></form></div></div>
<div id="onboardingModal" class="password-modal hide"><div class="password-card"><div class="brand"><div class="logo">聚</div><div><h2>完成首次设置</h2><div class="sub">请设置企业与组织的显示名称，完成后即可进入管理中心</div></div></div><form id="onboardingForm"><div class="field"><label>企业名称</label><input id="onboardingOrganization" required maxlength="100"></div><div class="field"><label>业务空间名称</label><input id="onboardingWorkspace" required maxlength="100"></div><div class="field"><label>默认团队名称</label><input id="onboardingTeam" required maxlength="100"></div><div class="field"><label>管理员显示名称</label><input id="onboardingDisplayName" required maxlength="100"></div><div id="onboardingError" class="error"></div><button class="btn" type="submit">完成设置并进入系统</button></form></div></div>
<div id="modal" class="modal-bg hide"><div class="modal"><div class="modal-head"><h3 id="modalTitle"></h3><span class="grow"></span><button class="btn secondary small" onclick="closeModal()">✕</button></div><form id="modalForm"><div id="modalBody"></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">取消</button><button class="btn" type="submit">确认保存</button></div></form></div></div><div id="toast" class="toast hide"></div>
<script>
const S={token:sessionStorage.getItem('v207_token')||'',profile:null,org:'',page:'dashboard',cache:{},loadVersion:0,tableState:{},tableRefresh:{}};
function staleContextError(){let e=Error('页面上下文已变化');e.code='STALE_CONTEXT';return e}const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
async function api(path,opt={}){let method=opt.method||'GET',requestVersion=S.loadVersion,guard=method==='GET'&&opt.contextGuard!==false,r=await fetch(path,{method,headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{}),...(opt.headers||{})},body:opt.body?JSON.stringify(opt.body):undefined});let d=await r.json().catch(()=>({ok:false,message:'响应格式错误'}));if(r.status===401&&S.token){sessionStorage.removeItem('v207_token');location.reload()}if(guard&&requestVersion!==S.loadVersion)throw staleContextError();if(!r.ok||d.ok===false)throw Error(d.message||d.code||('HTTP '+r.status));return d}
function toast(x,bad=false){let e=$('#toast');e.textContent=x;e.style.border='1px solid '+(bad?'var(--bad)':'var(--ok)');e.classList.remove('hide');setTimeout(()=>e.classList.add('hide'),2800)}function fmt(t){return t?new Date(Number(t)).toLocaleString():'—'}function status(v){return `<span class="status ${esc(v)}">${v==='active'?'正常':v==='disabled'?'已停用':esc(v||'未知')}</span>`}function qp(){return '?organization_id='+encodeURIComponent(S.org)}
function sessionStatus(r){if(r.revoked_at)return '<span class="status disabled">已撤销</span>';if(Number(r.expires_at)<=Date.now())return '<span class="status">已过期</span>';return '<span class="status active">活跃</span>'}function head(title,desc,action=''){return `<div class="pagehead"><div><h2>${title}</h2><p>${desc}</p></div><span class="grow"></span>${action}</div>`}function table(cols,items,actions){if(!items?.length)return '<div class="panel empty">暂无数据</div>';return `<div class="table-wrap"><table><thead><tr>${cols.map(x=>`<th>${esc(x[0])}</th>`).join('')}${actions?'<th>操作</th>':''}</tr></thead><tbody>${items.map(r=>`<tr>${cols.map(x=>{const v=x[2]?x[2](r):r[x[1]];return `<td>${v===undefined||v===null?'':typeof v==='string'?esc(v):v}</td>`}).join('')}${actions?`<td>${actions(r)}</td>`:''}</tr>`).join('')}</tbody></table></div>`;}
function passwordChangeRequired(x){const c=x?.credential||x?.user?.credential||{};return x?.mustChangePassword===true||x?.must_change_password===true||x?.forcePasswordChange===true||x?.passwordChangeRequired===true||x?.user?.mustChangePassword===true||x?.user?.must_change_password===true||c.must_change===true||c.must_change===1||c.mustChange===true}
function showPasswordModal(){$('#login').classList.add('hide');$('#app').classList.add('hide');$('#passwordError').textContent='';$('#passwordModal').classList.remove('hide');$('#oldPassword').focus()}
function hidePasswordModal(){$('#passwordModal').classList.add('hide')}
function showOnboardingModal(pd){$('#login').classList.add('hide');$('#app').classList.add('hide');$('#passwordModal').classList.add('hide');$('#onboardingError').textContent='';$('#onboardingOrganization').value=pd?.organization?.name||'';$('#onboardingWorkspace').value=pd?.workspace?.name||'';$('#onboardingTeam').value=pd?.team?.name||'';$('#onboardingDisplayName').value=pd?.user?.display_name||'';$('#onboardingModal').classList.remove('hide');$('#onboardingOrganization').focus()}
function hideOnboardingModal(){$('#onboardingModal').classList.add('hide')}
async function boot(){if(!S.token)return;try{const pd=await api('/api/v207/admin/profile');S.profile=pd;if(passwordChangeRequired(pd)){showPasswordModal();return}if(pd.onboardingRequired){showOnboardingModal(pd);return}hideOnboardingModal();$('#who').textContent=pd.user.display_name;$('#avatar').textContent=pd.user.display_name.slice(0,1);$('#scope').textContent=pd.platformAdmin?'平台超级管理员':'企业成员';const od=await api('/api/v207/admin/organizations');S.cache.organizations=od.items||[];$('#orgSelect').innerHTML=S.cache.organizations.map(o=>`<option value="${esc(o.organization_id)}">${esc(o.name)} · ${esc(o.organization_id)}</option>`).join('');S.org=pd.user.organization_id;$('#orgSelect').value=S.org;$('#login').classList.add('hide');$('#app').classList.remove('hide');await api('/health');$('#health').textContent='● 服务正常';navigate('dashboard')}catch(e){console.error('boot failed:',e);if(e.message&&(e.message.includes('403')||e.message.includes('Forbidden')||e.message.includes('首次登录'))){showPasswordModal();$('#passwordError').textContent='请先完成首次登录密码修改';return}sessionStorage.removeItem('v207_token');S.token='';$('#loginError').textContent=e.message||'登录失败'}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();const error=$('#loginError'),button=e.currentTarget.querySelector('button[type=submit]');error.textContent='';const organizationId=$('#loginOrg').value.trim(),loginName=$('#loginName').value.trim(),password=$('#loginPass').value;if(!organizationId||!loginName||!password){error.textContent='请输入企业 ID、登录名和密码';return}const oldText=button?.textContent;if(button){button.disabled=true;button.textContent='正在安全登录…'}try{const d=await api('/api/v207/auth/login',{method:'POST',body:{organizationId,loginName,password}});S.token=d.accessToken;sessionStorage.setItem('v207_token',S.token);await boot()}catch(x){const messages={INVALID_CREDENTIALS:'企业 ID、登录名或密码错误',ACCOUNT_LOCKED:'登录失败次数过多，账号已临时锁定',ORGANIZATION_NOT_FOUND:'企业不存在',INTERNAL_ERROR:'服务器内部错误，请查看服务日志'};error.textContent=messages[x.code]||x.message||'登录失败，请检查服务是否正常运行'}finally{if(button){button.disabled=false;button.textContent=oldText||'安全登录'}}};

function copyToClipboard(text){
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(text).then(()=>toast('已复制')).catch(()=>toast('复制失败',1));
 }else{
  const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('已复制');}catch(_){toast('复制失败',1);}
  document.body.removeChild(ta);
 }
}

async function chHealthLoad(){
 try{
  const d=await api('/api/v207/admin/sources?limit=500');
  const items=d.items||d||[];
  const by={};
  items.forEach(r=>{const c=r.channel||'未知';by[c]=by[c]||{a:0,t:0,last:0};
   by[c].t++;if(r.status==='active')by[c].a++;
   if(r.last_seen_at&&r.last_seen_at>by[c].last)by[c].last=r.last_seen_at;});
  const now=Date.now();
  let rows=Object.entries(by).sort((x,y)=>y[1].t-x[1].t).map(([c,v])=>{
   const pct=v.t?Math.round(v.a*100/v.t):0;
   const stale=v.a===0||(v.last&&now-v.last>30*864e5);
   const col=pct>=80?'var(--ok)':pct>=50?'var(--warn,#d97706)':'var(--err,#dc2626)';
   return `<tr><td>${esc(c)}</td><td>${v.a} / ${v.t}</td>`+
    `<td><div style="background:var(--line,#e5e7eb);border-radius:4px;height:8px;width:120px;display:inline-block;vertical-align:middle"><div style="background:${col};height:8px;border-radius:4px;width:${pct}%"></div></div> <b style="color:${col}">${pct}%</b></td>`+
    `<td${stale?' style="color:var(--err,#dc2626);font-weight:600"':''}>${v.last?fmt(v.last):'—'}${stale?' ⚠':''}</td></tr>`;}).join('');
  const el=document.getElementById('chHealth');if(!el)return;
  el.innerHTML=rows?`<div class="table-wrap"><table><thead><tr><th>渠道</th><th>活跃 / 总数</th><th>活跃占比</th><th>最近活动</th></tr></thead><tbody>${rows}</tbody></table></div>`
   :'<div class="empty">暂无来源数据</div>';
 }catch(e){const el=document.getElementById('chHealth');if(el)el.innerHTML='<div class="empty">加载失败</div>';}
}

renderSourceGraph(){
 let el=document.getElementById('sourceGraphBox');if(!el)return;
 if(!window.echarts){el.innerHTML='<p style="color:#888;padding:20px">ECharts 未加载，无法渲染拓扑图。</p>';return;}
 el.innerHTML='';
 let srcs=S.cache.pathSources||[],links=S.cache.pathLinks||[];
 if(!srcs.length){el.innerHTML='<p style="color:#888;padding:20px">暂无来源数据</p>';return;}
 let typeColor={'redirects_to':'#6366f1','lands_on':'#10b981','converts_to':'#f59e0b','routes_to':'#06b6d4','belongs_to':'#ec4899','derived_from':'#8b5cf6','referred_by':'#64748b'};
 let srcMap={};srcs.forEach(s=>{srcMap[s.source_id]={id:s.source_id,name:s.source_name||s.source_id,channel:s.channel||'unknown',status:s.status}});
 let nodes=[],nodeIds=new Set();
 srcs.forEach(s=>{nodes.push({id:s.source_id,name:s.source_name||s.source_id,category:s.channel||'unknown',symbolSize:48,value:[s.source_id],itemStyle:{color:s.status==='active'?'#6366f1':'#94a3b8'}});nodeIds.add(s.source_id);});
 let edgeData=[];
 links.forEach(l=>{
  if(nodeIds.has(l.from_source_id)&&nodeIds.has(l.to_source_id)){
   edgeData.push({source:l.from_source_id,target:l.to_source_id,lineStyle:{color:typeColor[l.link_type]||'#64748b',type:'dashed',width:2},label:{formatter:l.link_type,fontSize:10,color:'#64748b'}});
  }
 });
 if(window._srcGraphChart){try{window._srcGraphChart.dispose();}catch(e){}}
 let chart=echarts.init(el);window._srcGraphChart=chart;
 let categories=[...new Set(srcs.map(s=>s.channel||'unknown'))].map(c=>({name:c}));
 chart.setOption({
  backgroundColor:'transparent',
  tooltip:{formatter:p=>{if(p.dataType==='edge')return `${p.data.sourceName} → ${p.data.targetName}<br><b style="color:${typeColor[p.data.linkType]||'#64748b'}">${p.data.linkType}</b>`;return`<b>${p.data.name}</b><br>渠道：${p.data.category}<br>状态：${p.data.value[1]||'—'}`}},
  legend:[{data:categories.map(c=>c.name),top:10}],
  series:[{
   type:'graph',layout:'force',draggable:false,
   categories:categories,
   data:nodes.map(n=>{let s=srcs.find(x=>x.source_id===n.id);return{...n,name:n.name,symbolSize:40,category:n.category,value:[n.id,s?s.status:'unknown']}}),
   links:edgeData.map(e=>{let fs=srcs.find(x=>x.source_id===e.source),ts=srcs.find(x=>x.source_id===e.target);return{...e,sourceName:fs?fs.source_name:'?',targetName:ts?ts.source_name:'?',linkType:e.label?e.label.formatter:'unknown'}}),
   lineStyle:{curveness:0.2,opacity:0.7},
   label:{show:true,formatter:'{b}',fontSize:11,color:'var(--text,#334155)'},
   roam:false,
   force:{repulsion:200,edgeLength:140,layoutAnimation:true}
  }]
 });
 window.addEventListener('resize',()=>chart.resize());
},

 try{
  let pre=await api('/api/v207/admin/rbac/confirmations'+qp(),{method:'POST',body:{actionKey:'role.copy',name,sourceRoleId:rid}});

  toast('克隆成功：'+name);navigate('rbac-matrix');
 }catch(e){toast('克隆失败：'+(e.message||''),1)}
}

function computeDepth(items,parentKey='parent_id'){
 let map={};items.forEach(r=>{map[r[parentKey]||null]=(map[r[parentKey]||null]||0)+1});
 let depthMap={};
 function depth(id){
  if(depthMap[id]!==undefined)return depthMap[id];
  let node=items.find(r=>r.department_id===id||r.business_line_id===id||r.market_id===id);
  if(!node||!node[parentKey])return 0;
  return depthMap[id]=(depth(node[parentKey])+1);
 }
 return items.map(r=>depth(r.department_id||r.business_line_id||r.market_id));
}

function smartTable(key,cols,items,actions,filters,opts){
 if(!items?.length)return '<div class="panel empty">暂无数据</div>';
 let state=S.tableState[key]||(S.tableState[key]={q:'',filters:{},sortKey:null,sortDir:1});
 let bar=filters?`<div class="toolbar" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center">
  <input class="select" placeholder="搜索 ${opts?.searchHint||'关键字'}" value="${esc(state.q)}" oninput="tableStateUpdate('${esc(key)}','q',this.value);refreshTable('${esc(key)}')" style="min-width:160px;flex:1">
  ${filters.map(f=>`<select class="select" onchange="tableStateUpdate('${esc(key)}','${esc(f.field)}',this.value);refreshTable('${esc(key)}')" style="min-width:120px"><option value="">全部${esc(f.label)}</option>${(f.options||[]).map(o=>`<option value="${esc(o.value)}" ${state.filters[f.field]===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`).join('')}
  <span class="badge" id="__count_${esc(key)}">${items.length} 条</span>
  <button class="btn secondary small" onclick="tableReset('${esc(key)}')">重置</button>
 </div>`:'';
 let filtered=items;
 if(state.q){
  const q=state.q.toLowerCase();
  filtered=filtered.filter(r=>Object.values(r).some(v=>String(v||'').toLowerCase().includes(q)));
 }
 if(filters){
  Object.entries(state.filters||{}).forEach(([f,v])=>{if(!v)return;filtered=filtered.filter(r=>{let val=r[f];if(Array.isArray(val))return val.includes(v);return String(val||'')===v})});
 }
 if(state.sortKey){
  const k=state.sortKey,d=state.sortDir||1;
  filtered=[...filtered].sort((a,b)=>{
   let va=a[k],vb=b[k];
   if(typeof va==='number'&&typeof vb==='number')return(va-vb)*d;
   va=String(va||'');vb=String(vb||'');
   return va.localeCompare(vb,'zh-Hans-CN')*d;
  });
 }
 let count=filtered.length;
 S.tableState[key].filteredItems=filtered;
 let html=`<div class="table-wrap"><table><thead><tr>`;
 html+=cols.map(x=>{
  const k=x[1];const sortable=typeof k==='string'&&k&&x[3]!==false&&!k.startsWith('__');
  if(sortable){
   const active=state.sortKey===k;
   const arrow=active?(state.sortDir>0?' ▲':' ▼'):' ⇅';
   return `<th onclick="tableSort('${esc(key)}','${esc(k)}')" style="cursor:pointer;user-select:none">${esc(x[0])}${arrow}</th>`;
  }
  return `<th>${esc(x[0])}</th>`;
 }).join('');
 if(actions)html+='<th>操作</th>';
 html+='</tr></thead><tbody>';
 html+=filtered.map(r=>{
  let row='<tr>';
  cols.forEach(x=>{
   const rendered=typeof x[2]==='function';
   const v=rendered?x[2](r):r[x[1]];
   row+=`<td>${v===undefined||v===null?'':rendered?String(v):esc(v)}</td>`;
  });
  if(actions)row+=`<td>${actions(r)}</td>`;
  row+='</tr>';
  return row;
 }).join('');
 html+='</tbody></table></div>';
 let bar2=`<span class="badge" id="__count_${esc(key)}" style="margin-left:auto">${count} / ${items.length} 条</span>`;
 return bar+html+(filters?bar2:'');
}

}

function confirmModal({title='确认操作',message='',details=null,warning=null,confirmText='确认',cancelText='取消',danger=true,requireReason=false}){
  return new Promise(resolve=>{
    const m=$('#modal');
    $('#modalTitle').textContent=title;
    $('#modalBody').innerHTML=`
      ${message?`<div style="margin:6px 0 12px;font-size:14px;line-height:1.6">${esc(message)}</div>`:''}
      ${details?`<div style="padding:10px 12px;background:var(--panel-2,#f8fafc);border:1px solid var(--line,#e2e8f0);border-radius:8px;margin-bottom:10px;font-size:13px">${details}</div>`:''}
      ${warning?`<div style="padding:10px 12px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;color:#991b1b;font-size:13px;margin-bottom:10px">⚠ ${esc(warning)}</div>`:''}
      ${requireReason?`<div class="field"><label>操作原因（必填）</label><textarea id="__confirmReason" rows="2" placeholder="请说明删除原因，便于审计追溯" required></textarea></div>`:''}
    `;
    const act=$('#modalForm .modal-actions');
    act.classList.remove('hide');
    act.innerHTML=`<button type="button" class="btn secondary" id="__cancelBtn">${esc(cancelText)}</button><span class="grow"></span><button type="button" class="btn ${danger?'danger':''}" id="__confirmBtn">${esc(confirmText)}</button>`;
    const cleanup=()=>{$('#modalForm').onsubmit=null;act.innerHTML='';};
    $('#__cancelBtn').onclick=()=>{cleanup();closeModal();resolve(false);};
    $('#__confirmBtn').onclick=async()=>{
      if(requireReason){const r=($('#__confirmReason')||{}).value||'';if(!r.trim()){toast('请填写操作原因',1);return}cleanup();closeModal();resolve(r.trim());return}
      cleanup();closeModal();resolve(true);
    };
    $('#modalForm').onsubmit=async e=>{e.preventDefault();$('#__confirmBtn').click()};
    m.classList.remove('hide');
  });
}
async function safeDelete({path,kind,name,refs}){
  let preview=null;
  if(refs){
    const lines=Object.entries(refs).map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line,#e2e8f0)"><span style="color:#64748b">${esc(k)}</span><b>${v}</b></div>`).join('');
    preview=`<div style="margin-top:6px"><b style="color:#991b1b">仍有以下业务对象引用此${esc(kind)}：</b>${lines}<div style="margin-top:8px;color:#64748b;font-size:12px">请先处理上述关联对象，再执行删除。</div></div>`;
  }
  const msg=await confirmModal({title:`删除${kind}`,message:`确认永久删除${kind}「${name}」？此操作不可恢复。`,warning:refs?preview:null,confirmText:refs?'仍要删除':'确认删除'});
  if(!msg)return;
  const body=typeof msg==='string'?{reason:msg}:{};
  try{await api(path,{method:'DELETE',body});toast('已删除');loadPage()}
  catch(e){
    if(e.code==='ORG_IN_USE'||e.code==='TEAM_IN_USE'||e.code==='USER_IN_USE'||e.code==='WORKSPACE_IN_USE'||e.code==='DEVICE_IN_USE'||e.code==='SOURCE_IN_USE'||e.code==='CAMPAIGN_IN_USE'||e.code==='IN_USE'||e.code==='PLATFORM_IN_USE'){
      await confirmModal({title:'无法删除：仍有引用',message:String(e.message||'请先处理关联对象'),details:e.references?`<pre style="margin:0;font-size:12px">${esc(JSON.stringify(e.references,null,2))}</pre>`:null,confirmText:'我知道了',cancelText:'关闭',danger:false});
    }else toast(e.message||'删除失败',1);
  }
}

 let typeColor={organization:'#6366f1',workspace:'#8b5cf6',team:'#ec4899',user:'#f59e0b',account:'#10b981',source:'#06b6d4',device:'#64748b'};
 let typeSymbol={organization:'roundRect',workspace:'rect',team:'circle',user:'circle',account:'diamond',source:'triangle',device:'rect'};
 let categories=[...new Set(nodes.map(n=>n.category))].map(c=>({name:c,itemStyle:{color:typeColor[c]||'#94a3b8'}}));
 let data=nodes.map(n=>({...n,symbol:'-',symbolSize:n.category==='organization'?70:n.category==='workspace'?55:n.category==='team'?45:35,itemStyle:{color:typeColor[n.category]||'#94a3b8',borderColor:'#fff',borderWidth:2},label:{show:true,formatter:(p)=>p.data.name.length>14?p.data.name.slice(0,12)+'…':p.data.name,fontSize:n.category==='organization'?13:11,color:'#334155',position:'right'},emphasis:{label:{show:true,fontSize:14,fontWeight:600},itemStyle:{borderColor:'#fbbf24',borderWidth:3}}}));
 let links=edges.map(e=>({...e,lineStyle:{color:'#94a3b8aa',width:1,curveness:0.05},emphasis:{lineStyle:{color:'#fbbf24',width:2.5}}}));
 let countEl=document.getElementById('graphNodeCount');if(countEl)countEl.textContent=`${nodes.length} 节点 · ${edges.length} 关系`;
 if(window._graphChart)try{window._graphChart.dispose()}catch(e){}
 let chart=echarts.init(el);window._graphChart=chart;
 chart.setOption({
  backgroundColor:'transparent',
  tooltip:{formatter:p=>{if(p.dataType==='edge'){let s=nodes.find(n=>n.id===p.data.source),t=nodes.find(n=>n.id===p.data.target);return `${s?s.name:'?'} → ${t?t.name:'?'}`;}return`<b>${esc(p.data.name)}</b><br><span class="status ${p.data.category}">${esc(p.data.category)}</span><br>ID：<code style="font-size:10px">${esc(p.data.id)}</code>`}},
  legend:[{data:categories.map(c=>c.name),top:10,textStyle:{fontSize:11}}],
  series:[{
   type:'graph',layout:'force',
   roam:true,draggable:true,
   categories:categories,
   data:data,links:links,
   force:{repulsion:300,edgeLength:120,gravity:0.05,friction:0.35,layoutAnimation:true},
   lineStyle:{opacity:0.6},
   emphasis:{focus:'adjacency',lineStyle:{width:2.5}}
  }]
 });
 window.addEventListener('resize',()=>{try{chart.resize()}catch(e){}});
}

// ===== Stage2 patch: org tree =====
function buildTree(items,idKey,parentKey,nameKey){
  const map={},roots=[];
  (items||[]).forEach(it=>{map[it[idKey]]={name:it[nameKey]||it.name||'(未命名)',children:[],raw:it};});
  (items||[]).forEach(it=>{
    const node=map[it[idKey]],p=it[parentKey];
    if(p&&map[p])map[p].children.push(node);else roots.push(node);
  });
  const prune=n=>{if(!n.children.length)delete n.children;else n.children.forEach(prune);};
  roots.forEach(prune);
  return roots.length===1?roots[0]:(roots.length?{name:'全部',children:roots}:{name:'（暂无数据）'});
}
function toggleOrgTree(){
  const p=document.getElementById('orgTreePanel');if(!p)return;
  const show=p.style.display==='none';
  p.style.display=show?'block':'none';
  if(show)renderOrgTree('deps');
}
function renderOrgTree(kind){
  const el=document.getElementById('orgTreeChart');if(!el)return;
  const d=window._orgData||{};const cfg={
    deps:{items:d.deps,idKey:'department_id',parentKey:'parent_id',nameKey:'name'},
    lines:{items:d.lines,idKey:'business_line_id',parentKey:'parent_id',nameKey:'name'},
    mkts:{items:d.mkts,idKey:'market_id',parentKey:'parent_id',nameKey:'name'}
  }[kind]||{};
  const tree=buildTree(cfg.items,cfg.idKey,cfg.parentKey,cfg.nameKey);
  if(!window.echarts){el.innerHTML='<p style="color:#888;padding:20px">ECharts 未加载，无法渲染树状图。</p>';return;}
  el.innerHTML='';
  if(window._orgTreeChart){try{window._orgTreeChart.dispose();}catch(e){}}
  const chart=echarts.init(el);window._orgTreeChart=chart;
  // ---- 树状图美化 V2：层级渐变配色 + 发光 + 分层入场 ----
  function nodeColor(d){const dep=d.depth||0;return ['#6366f1','#8b5cf6','#ec4899','#f59e0b','#10b981'][dep%5];}
  const __parentMap=new Map();
  (function index(n,p){__parentMap.set(n.name,p?p.name:null);if(n.children)n.children.forEach(c=>index(c,n));})(tree);
  function decorate(n){n.itemStyle={color:nodeColor(n),
      borderColor:'rgba(255,255,255,.25)',borderWidth:2,
      shadowColor:nodeColor(n),shadowBlur:12};
    if(n.children){n.children.forEach(c=>decorate(c));}else{
      n.itemStyle={color:'#34d399',borderColor:'rgba(52,211,153,.35)',borderWidth:5,shadowColor:'rgba(52,211,153,.5)',shadowBlur:10};}}
  decorate(tree);
  chart.setOption({
    color:['#6366f1'],
    tooltip:{trigger:'item',backgroundColor:'rgba(17,20,34,.94)',borderColor:'rgba(129,140,248,.35)',
      borderWidth:1,padding:[10,14],textStyle:{color:'#e6e9f2',fontSize:13},
      extraCssText:'border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.45);backdrop-filter:blur(6px);',
      formatter:function(p){const d=p.data;let path=[d.name];let par=__parentMap.get(d.name);
        while(par){path.unshift(par);par=__parentMap.get(par);}
        return '<b style="font-size:14px">'+d.name+'</b><br><span style="color:#8a93a6">层级路径：</span>'+path.join(' <span style="color:#6366f1">›</span> ');}},
    series:[{type:'tree',data:[tree],top:'8%',left:'12%',bottom:'8%',right:'22%',
      symbol:'circle',symbolSize:16,initialTreeDepth:-1,roam:false,
      lineStyle:{color:'rgba(148,163,184,.4)',width:1.5,curveness:.6},
      label:{position:'left',verticalAlign:'middle',align:'right',fontSize:13,
        fontWeight:600,color:'#dbe1ee',distance:9,
        textBorderColor:'rgba(0,0,0,.4)',textBorderWidth:2},
      leaves:{label:{position:'right',verticalAlign:'middle',align:'left',fontSize:12,
        fontWeight:400,color:'#9aa3b5',distance:9}},
      emphasis:{focus:'ancestor',blurScope:'parent',
        lineStyle:{width:3,color:'#a5b4fc',shadowColor:'rgba(165,180,252,.8)',shadowBlur:8},
        itemStyle:{shadowBlur:22}},
      expandAndCollapse:true,
      animationDuration:700,animationDurationUpdate:450,
      animationEasing:'cubicOut',animationEasingUpdate:'cubicInOut'}]});
  window.addEventListener('resize',()=>chart.resize());
}
boot();
